---
name: ol-local-dev-apps-infra
runtime:
  name: python
  options:
    # The pulumi module lives only in the repo's uv venv. Without this the
    # language host and the pulumi-python dynamic-provider host resolve python3
    # from $PATH, which in the devenv shell is a nix interpreter with no pulumi
    # installed. uv sync keeps this venv matching uv.lock; `pulumi install` is
    # not the way to populate it, since that pip-installs a requirements.txt
    # this repo does not have.
    virtualenv: ../../../.venv
description: >
  Applications infrastructure for the MIT Learn local development environment.
  Provisions databases and Keycloak realm resources that depend on the core
  infrastructure stack. Must be deployed after core stack is ready.
backend:
  url: file://../.pulumi
