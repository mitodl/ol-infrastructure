---
# k3d cluster configuration for the MIT Learn local development environment.
# Usage: k3d cluster create --config local-dev/cluster/k3d-config.yaml
# Or let setup.sh manage cluster lifecycle.
apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: local-dev

servers: 1
agents: 2

# The node image fixes the containerd version, and containerd 2.x is required.
# mitodl/ol-python-base is built on Docker Hardened Images whose base layers
# are zstd-compressed, and Tilt's docker_build exports them with the media type
# application/vnd.docker.image.rootfs.diff.tar.zstd. containerd 1.7 (k3s up to
# v1.32) does not recognise that type as a layer, so it drops those layers and
# rejects every app image with "number of layers and diffIDs don't match".
# k3s v1.33 and later ship containerd 2.x. CI builds sidestep this with
# OUTPUT_OCI=true on oci-build-task; docker_build has no equivalent.
# Applies on cluster (re)create: teardown.sh + setup.sh. Recreating destroys
# every PersistentVolume, so run local-dev/scripts/pg-backup.sh first and
# pg-restore.sh after.
image: docker.io/rancher/k3s:v1.35.8-k3s1

# Local image registry — images built by Tilt are pushed here.
# The registry container itself is created by setup.sh (`k3d registry create
# --image <zot>`) rather than by this file, because its config file must be
# bind-mounted from the repo checkout and this YAML cannot express that host
# path portably. The registry is zot rather than registry:2: zot enforces
# image retention (keep the N most recently pushed tags) and garbage
# collection as its own declarative config — local-dev/cluster/zot-config.json
# — so no external cleanup process has to reach into its storage.
registries:
  use:
  - k3d-registry.localhost:5001
  config: |
    mirrors:
      "k3d-registry.localhost:5001":
        endpoint:
          - "http://k3d-registry.localhost:5001"

# Expose HTTPS and HTTP on host ports 443/80 so that *.mit.dev ingress routes
# are reachable without a port suffix.
ports:
- port: 80:30080
  nodeFilters:
  - loadbalancer
- port: 443:30443
  nodeFilters:
  - loadbalancer

# Disable Traefik — APISIX Ingress Controller replaces it.
options:
  # Every pod on this cluster inherits its file-descriptor limit from the k3d
  # node container: Docker starts containers with RLIMIT_NOFILE soft=1024
  # (hard=524288), k3s and containerd inherit that from the node's PID 1, and
  # containerd's CRI plugin sets no default_ulimits of its own, so the pod
  # process ends up with a soft limit of 1024. Raising the *host's* ulimit does
  # nothing — dockerd applies its own default to each container regardless.
  #
  # 1024 fds is not enough for the local-infra data stores. Qdrant mmaps ~30
  # files per segment and mit-learn's collections are sharded 6 ways, so
  # creating payload indexes exhausted the limit and the collection bootstrap
  # died with "Failed to save structure on disk with error: Too many open
  # files (os error 24)". OpenSearch wants 65536 for the same reason.
  #
  # Soft is raised to 65536 rather than all the way to the hard limit because
  # some runtimes size fd tables off the soft limit; the hard limit stays at
  # Docker's default so a process can still opt itself higher.
  # Applies on cluster (re)create: teardown.sh + setup.sh.
  runtime:
    ulimits:
    - name: nofile
      soft: 65536
      hard: 524288
  k3s:
    extraArgs:
    - arg: --disable=traefik
      nodeFilters:
      - server:*
    # Each node's containerd image store caches every image it ever pulls and
    # nothing else cleans it up (Tilt can't reach it; see disk-janitor.sh).
    # kubelet's own image GC does, but its default thresholds (85%/80%) are
    # percentages of the node filesystem — the Docker VM's data disk, shared
    # by all nodes, under OrbStack/Docker Desktop — while k3s sets the
    # disk-pressure eviction taint at 95% used (nodefs.available<5%). That
    # leaves only ~10% of the disk between "GC starts" and "everything
    # stops scheduling". Starting GC at 75% doubles that band to ~20%.
    # Applies on cluster (re)create: teardown.sh + setup.sh.
    - arg: --kubelet-arg=image-gc-high-threshold=75
      nodeFilters:
      - server:*
      - agent:*
    - arg: --kubelet-arg=image-gc-low-threshold=70
      nodeFilters:
      - server:*
      - agent:*

kubeAPI:
  hostIP: "0.0.0.0"
  hostPort: "6550"
