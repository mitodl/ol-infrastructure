---
apiVersion: v1
kind: ConfigMap
metadata:
  name: learn-ai-env
  namespace: learn-ai
data:
  DJANGO_SETTINGS_MODULE: "main.settings"
  MITOL_APP_BASE_URL: "https://ai.learn.mit.test"
  MITOL_DB_DISABLE_SSL: "True"
  MITOL_USE_S3: "False"
  # DEBUG must stay False: settings.py adds debug_toolbar to INSTALLED_APPS
  # when it is True, and the production image does not have it.
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  USE_X_FORWARDED_HOST: "True"
  USE_X_FORWARDED_PORT: "True"

  # mkcert root CA — trusts the local wildcard TLS cert for inter-pod HTTPS
  REQUESTS_CA_BUNDLE: "/etc/ssl/local-dev/rootCA.pem"
  SSL_CERT_FILE: "/etc/ssl/local-dev/rootCA.pem"

  # Keycloak/OIDC
  KEYCLOAK_BASE_URL: "https://sso.ol.mit.test"
  KEYCLOAK_REALM_NAME: "olapps"

  # Valkey (cluster-local)
  # Each app needs its own Valkey DBs, or Celery and RedBeat pick up another
  # app's tasks. The allocation is listed under Shared Valkey in
  # local-dev/ARCHITECTURE.md.
  REDIS_URL: "redis://valkey.local-infra.svc.cluster.local:6379/8"
  REDIS_DOMAIN: "redis://valkey.local-infra.svc.cluster.local:6379/8"
  CELERY_BROKER_URL: "redis://valkey.local-infra.svc.cluster.local:6379/9"
  CELERY_RESULT_BACKEND: "redis://valkey.local-infra.svc.cluster.local:6379/9"

  # AI proxy (local LiteLLM in local-infra). Off by default to match RC and
  # production, which call OpenAI directly with OPENAI_API_KEY (see
  # secrets.yaml). To opt in, see app-env.local.yaml.example.
  # AI_PROXY_URL: "http://litellm.local-infra.svc.cluster.local:4000"
  # AI_PROXY_CLASS: "LiteLLMProxy"

  # mit-learn API (for AI to call back)
  MIT_LEARN_API_PROXY_BASE_URL: "http://mitlearn-webapp.mit-learn.svc.cluster.local:8060/api/"

  # Email (Mailpit) — settings reads MITOL_EMAIL_* prefix
  MITOL_EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  MITOL_EMAIL_HOST: "mailpit.local-infra.svc.cluster.local"
  MITOL_EMAIL_PORT: "1025"
  MITOL_EMAIL_TLS: "False"
  # Mailgun settings are required unconditionally by settings.py even when
  # using SMTP. Stub values — Mailpit handles all email in local dev.
  MAILGUN_SENDER_DOMAIN: "ol.mit.test"
  MAILGUN_FROM_EMAIL: "MIT Learn AI <noreply@ol.mit.test>"
  MAILGUN_KEY: "local-dev-mailgun-stub"

  # Cookie configuration
  MITOL_COOKIE_NAME: "learn-ai-auth"
  MITOL_COOKIE_DOMAIN: ".mit.test"
  # learn-ai is also served at api.learn.mit.test/ai/* (apisix-routes.yaml), the
  # host where mit-learn sets sessionid/csrftoken on .learn.mit.test. Own names
  # keep the two apps' Django cookies apart, as in RC and production. The CSRF
  # cookie sits on .learn.mit.test so the frontend on learn.mit.test can read it.
  SESSION_COOKIE_NAME: "session_learn_ai"
  CSRF_COOKIE_NAME: "learn_ai_csrftoken"
  CSRF_COOKIE_DOMAIN: ".learn.mit.test"
  CSRF_TRUSTED_ORIGINS: '["https://ai.learn.mit.test","https://learn.mit.test","https://api.learn.mit.test","https://ai-sandbox.learn.mit.test"]'
  # Hosts /http/login/?next= may return to; the setting's default is the
  # production hosts. The local counterparts of QA's list (sandbox, Learn, Open
  # edX, MITx Online), plus ai.learn itself.
  LOGIN_REDIRECT_ALLOWED_HOSTS: '["ai.learn.mit.test","ai-sandbox.learn.mit.test","learn.mit.test","lms.mit.test","mitxonline.mit.test"]'
  # Courses the sandbox's demo Canvas bots may use; the setting's default [] 400s
  # every request. Same lists as CI/QA/Production (Pulumi.*.yaml).
  CANVAS_SYLLABUS_DEMO_READABLE_IDS: '["14566-kaleba:20211202", "34642-15.095_FA25"]'
  CANVAS_TUTOR_DEMO_RUN_READABLE_IDS: '["14566-kaleba:20211202+canvas", "34642-15.095_FA25+canvas"]'

  # Feature flags
  FEATURE_LEARN_AI_ENABLED: "True"
