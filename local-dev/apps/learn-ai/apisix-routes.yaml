---
apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: learnai-shared-plugins
  namespace: learn-ai
spec:
  plugins:
  - name: redirect
    enable: true
    config:
      http_to_https: true
  - name: cors
    enable: true
    config:
      allow_origins: "https://ai.learn.mit.test,https://learn.mit.test"
      allow_methods: "GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS"
      allow_headers: "Authorization,Content-Type,X-CSRFToken,X-Requested-With"
      expose_headers: "X-CSRFToken"
      allow_credential: true
      max_age: 3600
  - name: response-rewrite
    enable: true
    config:
      headers:
        set:
          Referrer-Policy: "origin"
  - name: prometheus
    enable: true
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: learnai-tls
  namespace: learn-ai
spec:
  ingressClassName: apache-apisix
  hosts:
  - "ai.learn.mit.test"
  secret:
    name: local-dev-tls
    namespace: learn-ai
---
# ApisixRoute for ai.learn.mit.test.
#
# Sub-routes match QA pattern:
#   websocket  : /ws/*          (pass, websocket enabled)
#   passauth   : /*             (pass — injects X-Userinfo if session present)
#   logout-redirect : /logout/* (redirect to /logout)
#   reqauth    : /admin/login/*, /http/login/* (require authentication)
#
# No explicit redirect_uri — lua-resty-openidc auto-derives it from the
# initiating request URL so the callback round-trips to the same path.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: learnai-route
  namespace: learn-ai
spec:
  ingressClassName: apache-apisix
  http:
  - name: websocket
    priority: 1
    match:
      hosts:
      - "ai.learn.mit.test"
      paths:
      - "/ws/*"
    backends:
    - serviceName: learnai-webapp
      servicePort: 8000
    plugin_config_name: learnai-shared-plugins
    plugins:
    # secretRef supplies client_id, client_secret, realm, discovery and
    # session.secret (_make_oidc_secret in local-dev/infra/modules/keycloak.py);
    # the ingress controller merges it over config, so those keys are not
    # repeated inline.
    - name: openid-connect
      enable: true
      secretRef: ol-learn-ai-oidc  # pragma: allowlist secret
      config:
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_basic
        scope: "openid profile email"
        ssl_verify: false
        renew_access_token_on_expiry: true
        logout_path: "/logout"
        post_logout_redirect_uri: "/"
        session:
          # 0 disables lua-resty-session's 900s idling / 3600s rolling
          # defaults, as the deployed OIDC config does.
          idling_timeout: 0
          rolling_timeout: 0
        session_contents:
          access_token: true
          enc_id_token: true
          id_token: true
          user: true
        unauth_action: pass
    websocket: true

  - name: passauth
    priority: 2
    match:
      hosts:
      - "ai.learn.mit.test"
      paths:
      - "/*"
    backends:
    - serviceName: learnai-webapp
      servicePort: 8000
    plugin_config_name: learnai-shared-plugins
    plugins:
    - name: openid-connect
      enable: true
      secretRef: ol-learn-ai-oidc  # pragma: allowlist secret
      config:
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_basic
        scope: "openid profile email"
        ssl_verify: false
        renew_access_token_on_expiry: true
        logout_path: "/logout"
        post_logout_redirect_uri: "/"
        session:
          # 0 disables lua-resty-session's 900s idling / 3600s rolling
          # defaults, as the deployed OIDC config does.
          idling_timeout: 0
          rolling_timeout: 0
        session_contents:
          access_token: true
          enc_id_token: true
          id_token: true
          user: true
        unauth_action: pass

  - name: logout-redirect
    priority: 10
    match:
      hosts:
      - "ai.learn.mit.test"
      paths:
      - "/logout/*"
    backends:
    - serviceName: learnai-webapp
      servicePort: 8000
    plugins:
    - name: redirect
      enable: true
      config:
        uri: "/logout"

  - name: reqauth
    priority: 10
    match:
      hosts:
      - "ai.learn.mit.test"
      paths:
      - "/admin/login/*"
      - "/http/login/*"
    backends:
    - serviceName: learnai-webapp
      servicePort: 8000
    plugin_config_name: learnai-shared-plugins
    plugins:
    - name: openid-connect
      enable: true
      secretRef: ol-learn-ai-oidc  # pragma: allowlist secret
      config:
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_basic
        scope: "openid profile email"
        ssl_verify: false
        renew_access_token_on_expiry: true
        logout_path: "/logout"
        post_logout_redirect_uri: "/"
        session:
          # 0 disables lua-resty-session's 900s idling / 3600s rolling
          # defaults, as the deployed OIDC config does.
          idling_timeout: 0
          rolling_timeout: 0
        session_contents:
          access_token: true
          enc_id_token: true
          id_token: true
          user: true
        unauth_action: auth
---
# learn-ai under /ai/* on mit-learn's API host, as RC and production serve it
# (src/ol_infrastructure/applications/learn_ai/__main__.py). Here the browser
# sends mit-learn's gateway session cookie, so learn-ai sees the logged-in user;
# on ai.learn.mit.test it never gets that cookie and everyone is anonymous.
#
# The openid-connect config matches mit-learn's passauth (client, scope,
# session settings), so this reads and writes the same
# mitlearn_apisix_session_dev cookie. Its redirect and logout paths are left
# out: none fall under /ai/*, and the reqauth login's callback is derived from
# the original /ai/... URL. Same pattern as mitxonline-learn-proxy-route.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: learnai-mitlearn-route
  namespace: learn-ai
spec:
  ingressClassName: apache-apisix
  http:
  - name: passauth
    priority: 0
    match:
      hosts:
      - api.learn.mit.test
      paths:
      - "/ai/*"
    backends:
    - serviceName: learnai-webapp
      servicePort: 8000
    plugin_config_name: learnai-shared-plugins
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - "^/ai/(.*)"
        - "/$1"
    - name: openid-connect
      enable: true
      secretRef: ol-mitlearn-oidc  # pragma: allowlist secret
      config:
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_post
        scope: "openid profile email ol-profile"
        unauth_action: pass
        session:
          # Same as mit-learn's routes (local-dev/apps/mit-learn/apisix-routes.yaml),
          # so this reads mit-learn's login session.
          cookie_name: mitlearn_apisix_session_dev
          cookie_domain: ".learn.mit.test"
          absolute_timeout: 1209600
          idling_timeout: 0
          rolling_timeout: 0
        ssl_verify: false

  - name: reqauth
    priority: 10
    match:
      hosts:
      - api.learn.mit.test
      paths:
      - "/ai/admin/login/*"
      - "/ai/http/login/*"
    backends:
    - serviceName: learnai-webapp
      servicePort: 8000
    plugin_config_name: learnai-shared-plugins
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - "^/ai/(.*)"
        - "/$1"
    - name: openid-connect
      enable: true
      secretRef: ol-mitlearn-oidc  # pragma: allowlist secret
      config:
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_post
        scope: "openid profile email ol-profile"
        unauth_action: auth
        session:
          # Same as mit-learn's routes (local-dev/apps/mit-learn/apisix-routes.yaml),
          # so this reads mit-learn's login session.
          cookie_name: mitlearn_apisix_session_dev
          cookie_domain: ".learn.mit.test"
          absolute_timeout: 1209600
          idling_timeout: 0
          rolling_timeout: 0
        ssl_verify: false
