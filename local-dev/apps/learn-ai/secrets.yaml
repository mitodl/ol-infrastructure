---
# Local values for learn-ai's secret-backed variables. Deployed stacks read
# these variables from Vault, as described in
# src/ol_infrastructure/applications/learn_ai/vault_secrets.py; the program
# writes the ones under `values:` into the learn-ai-secrets Secret every
# container reads through envFrom. Every described variable is named exactly
# once, under `values:` or `unset:`, and the program stops otherwise, so a
# variable added to the description needs a decision here. A key set under
# learn_ai:env_vars in pulumi/Pulumi.Dev.yaml wins over this file (env: beats
# envFrom), which is where a real OPENAI_API_KEY goes. mit.test is swapped for
# the cluster's root domain.
values:
  SECRET_KEY: "local-dev-learn-ai-insecure-secret-key"  # pragma: allowlist secret
  DATABASE_URL: "postgres://app:localdev@local-pg-rw.local-infra.svc.cluster.local:5432/learnai"  # pragma: allowlist secret
  # A placeholder for the local model stub, which ignores it; LiteLLM refuses an
  # empty key. A real key goes under learn_ai:env_vars, which also turns the
  # stub off.
  OPENAI_API_KEY: "local-dev-stub-key"  # pragma: allowlist secret
  # settings.py requires it even though MITOL_EMAIL_* sends to Mailpit.
  MAILGUN_KEY: "local-dev-mailgun-stub"  # pragma: allowlist secret
# Not set locally, so the app's own default applies (an empty string would
# not: Django reads it as a value). LEARN_ACCESS_TOKEN belongs under
# learn_ai:env_vars in pulumi/Pulumi.Dev.yaml when the bots' course search is
# wanted; the LLM keys other than OPENAI_API_KEY likewise.
unset:
- AI_ZENDESK_OAUTH_CLIENT_ID
- AI_ZENDESK_OAUTH_CLIENT_SECRET
- GEMINI_API_KEY
- LANGSMITH_API_KEY
- LEARN_ACCESS_TOKEN
- MAILGUN_RECIPIENT_OVERRIDE
- MAILGUN_SENDER_DOMAIN
- MAILGUN_URL
- POSTHOG_PERSONAL_API_KEY
- POSTHOG_PROJECT_API_KEY
- SENTRY_DSN
- STATUS_TOKEN
- TOGETHERAI_API_KEY
- OPIK_KEYCLOAK_CLIENT_ID
- OPIK_KEYCLOAK_CLIENT_SECRET
- OPIK_KEYCLOAK_TOKEN_URL
# The key-auth consumer for the /http/canvas_* routes; the gateway reads it, the
# app never does, so it stays out of the Secret above.
canvas_syllabus_token: "local-dev-canvas-syllabus-token"  # pragma: allowlist secret
