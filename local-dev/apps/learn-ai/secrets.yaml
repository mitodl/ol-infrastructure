---
# Local values for learn-ai's secret-backed variables; the program writes the
# `values:` map into the learn-ai-secrets Secret every container reads through
# envFrom. Deployed stacks read these from Vault. A key set under
# learn_ai:env_vars in pulumi/Pulumi.Dev.yaml wins over this file (env: beats
# envFrom), which is where a real OPENAI_API_KEY goes. mit.test is swapped for
# the cluster's root domain.
values:
  SECRET_KEY: "local-dev-learn-ai-insecure-secret-key"  # pragma: allowlist secret
  DATABASE_URL: "postgres://app:localdev@local-pg-rw.local-infra.svc.cluster.local:5432/learnai"  # pragma: allowlist secret
  # Empty, so AI features fail until a key is set under learn_ai:env_vars.
  OPENAI_API_KEY: ""
  # settings.py requires it even though MITOL_EMAIL_* sends to Mailpit.
  MAILGUN_KEY: "local-dev-mailgun-stub"  # pragma: allowlist secret
# The key-auth consumer for the /http/canvas_* routes; the gateway reads it, the
# app never does, so it stays out of the Secret above.
canvas_syllabus_token: "local-dev-canvas-syllabus-token"  # pragma: allowlist secret
