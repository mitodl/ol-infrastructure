---
# CMS (Studio) config deltas — see configmaps/lms-config.yaml for why this is an
# override layer rather than a full ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-config-overrides
  namespace: openedx
data:
  CELERY_BROKER_HOSTNAME: "valkey.local-infra.svc.cluster.local"
  # lehrer leaves the vhost empty, which is DB 0 (mit-learn's broker). The LMS
  # and Studio share one broker, so both override files use 12. The allocation
  # is listed under Shared Valkey in local-dev/ARCHITECTURE.md.
  CELERY_BROKER_VHOST: "12"
  ELASTIC_SEARCH_HOST: "opensearch-cluster-master.local-infra.svc.cluster.local"

  LMS_BASE_URL: "https://lms.mit.test"
  CMS_BASE_URL: "https://studio.mit.test"
  LMS_BASE: "lms.mit.test"
  CMS_BASE: "studio.mit.test"
  HTTPS: "on"
  # lehrer turns this off for its plain-http standalone stack. Here cms-sso is
  # registered with an https callback, and "false" would leave the callback's
  # scheme to whatever X-Forwarded-Proto APISIX sends rather than forcing it.
  SOCIAL_AUTH_REDIRECT_IS_HTTPS: "true"

  # Studio's home view is a redirect into the authoring MFE, and the shared
  # header template links to the same URL from every page, 500.html included.
  # The master release has no legacy Studio home to fall back to, so while this
  # is unset every Studio URL raises ImproperlyConfigured. The MFE is the
  # mfe-authoring Deployment the Tiltfile builds, reached through
  # apisix-routes.yaml's authoring-mfe-route. lehrer binds this variable to the
  # Django setting only when its settings model declares the field; the
  # README's Open edX section has the check.
  COURSE_AUTHORING_MICROFRONTEND_URL: "https://studio.mit.test/authoring"
