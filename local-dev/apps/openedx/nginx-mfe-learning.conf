server {
    listen 80;
    index index.html;

    # Emit a relative Location header. TLS terminates at APISIX, so $scheme in
    # here is http; with the default `absolute_redirect on` the /learn redirect
    # below would rewrite the browser's https:// URL to http:// and downgrade
    # the scheme. Relative leaves the browser on whatever it came in on.
    absolute_redirect off;

    # The learning MFE is built with PUBLIC_PATH=/learn/, so its own HTML asks
    # for /learn/runtime.<hash>.js, /learn/app.<hash>.css and so on, and its
    # webpack runtime loads lazy chunks from the same prefix (r.p="/learn/").
    # It therefore cannot use lehrer's shared nginx-mfe.conf, which serves the
    # dist at /.
    #
    # The dist is COPYed to /usr/share/nginx/html/learn/ rather than aliased
    # from the root: `alias` inside a prefix location plus try_files has
    # surprising interactions with the fallback path, whereas a real
    # subdirectory lets `root` resolve /learn/* the obvious way.
    root /usr/share/nginx/html;

    # SPA routing. /learn/course/<key>/home is a React Router path with no file
    # behind it, so anything that is not a real file falls through to the MFE's
    # index.html. The fallback is /learn/index.html, not /index.html: the
    # document that comes back has to be the one whose asset tags are already
    # /learn/-prefixed.
    location /learn/ {
        try_files $uri $uri/ /learn/index.html;
    }

    # Bare /learn, no trailing slash. LEARNING_MICROFRONTEND_URL carries no
    # trailing slash, so the LMS can emit exactly this path; the APISIX route
    # lists it for the same reason. `location /learn/` does not match it and
    # the catch-all below would 404 it, so redirect into the prefix that does.
    location = /learn {
        return 301 /learn/;
    }

    # Content-hashed by webpack, so safe to cache hard. Scoped to /learn/ so it
    # cannot start claiming paths this server does not own.
    location ~* ^/learn/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Anything outside /learn/ is a routing mistake upstream rather than a
    # client error worth a page: this Service is only ever reached through the
    # APISIX /learn/* route. 404 plainly instead of falling back to the SPA,
    # which would make a misrouted path look like a broken MFE.
    location / {
        return 404;
    }
}
