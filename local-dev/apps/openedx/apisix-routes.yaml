---
# TLS certs for openedx services — reuse the shared local-dev-tls wildcard cert.
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: openedx-tls
  namespace: openedx
spec:
  ingressClassName: apache-apisix
  hosts:
  - "lms.mit.test"
  - "studio.mit.test"
  - "notes.mit.test"
  secret:
    name: local-dev-tls
    namespace: openedx
---
apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: openedx-shared-plugins
  namespace: openedx
spec:
  plugins:
  - name: redirect
    enable: true
    config:
      http_to_https: true
  - name: prometheus
    enable: true
---
# LMS — edx-platform learning management system.
# edx-platform handles its own session/auth — no OIDC plugin at the ingress layer.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: lms-route
  namespace: openedx
spec:
  ingressClassName: apache-apisix
  http:
  - name: lms
    priority: 0
    match:
      hosts:
      - "lms.mit.test"
      paths:
      - "/*"
    backends:
    - serviceName: lms
      servicePort: 8000
    plugin_config_name: openedx-shared-plugins
---
# Learning MFE — served on the LMS host at /learn, which is where
# frontend-app-learning is built to live (PUBLIC_PATH=/learn/) and what
# mitxonline's CourseRun.courseware_url points at. Production does the same:
# edxapp's k8s_configmaps.py sets LEARNING_MICROFRONTEND_URL to
# https://<lms domain>/learn.
#
# priority 10 beats the lms route's 0 so /learn/* lands here while every other
# path still reaches edx-platform. Both routes share the host, and APISIX picks
# the higher priority on a tie of specificity rather than the longer path.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: learning-mfe-route
  namespace: openedx
spec:
  ingressClassName: apache-apisix
  http:
  - name: learning-mfe
    priority: 10
    match:
      hosts:
      - "lms.mit.test"
      paths:
      # Both forms: /learn/* covers the SPA routes and the hashed assets,
      # /learn alone is the bare entry point a hand-typed URL or a redirect
      # without the trailing slash produces, which /learn/* does not match.
      - "/learn"
      - "/learn/*"
    backends:
    - serviceName: mfe-learning
      servicePort: 80
    plugin_config_name: openedx-shared-plugins
---
# CMS (Studio) — edx-platform course authoring tool.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: studio-route
  namespace: openedx
spec:
  ingressClassName: apache-apisix
  http:
  - name: studio
    priority: 0
    match:
      hosts:
      - "studio.mit.test"
      paths:
      - "/*"
    backends:
    - serviceName: cms
      servicePort: 8010
    plugin_config_name: openedx-shared-plugins
---
# Notes API — edx-notes-api annotation service.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: notes-route
  namespace: openedx
spec:
  ingressClassName: apache-apisix
  http:
  - name: notes
    priority: 0
    match:
      hosts:
      - "notes.mit.test"
      paths:
      - "/*"
    backends:
    - serviceName: notes
      servicePort: 8000
    plugin_config_name: openedx-shared-plugins
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: authoring-mfe-route
  namespace: openedx
spec:
  ingressClassName: apache-apisix
  http:
  - name: authoring-mfe
    # Above studio-route's /* on the same host.
    priority: 10
    match:
      hosts:
      - "studio.mit.test"
      paths:
      # Both forms, as for learning-mfe-route: COURSE_AUTHORING_MICROFRONTEND_URL
      # carries no trailing slash, so Studio's redirect into the MFE lands on
      # the bare path, which /authoring/* does not match.
      - "/authoring"
      - "/authoring/*"
    backends:
    - serviceName: mfe-authoring
      servicePort: 80
    plugin_config_name: openedx-shared-plugins
---
# Meilisearch, which the authoring MFE's Libraries V2 pages query from the
# browser with a tenant token Studio signs (MEILISEARCH_PUBLIC_URL in
# configmaps/cms-config.yaml). A path on the Studio host rather than a host of
# its own, so it needs no new name in /etc/hosts and no CORS: the MFE is served
# from this host too. meilisearch-js resolves its request paths relative to the
# URL, so the /meilisearch prefix survives and is stripped here.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: meilisearch-route
  namespace: openedx
spec:
  ingressClassName: apache-apisix
  http:
  - name: meilisearch
    # Above studio-route's /* on the same host.
    priority: 10
    match:
      hosts:
      - "studio.mit.test"
      paths:
      - "/meilisearch/*"
    backends:
    - serviceName: meilisearch
      servicePort: 7700
    plugin_config_name: openedx-shared-plugins
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - "^/meilisearch/(.*)"
        - "/$1"
