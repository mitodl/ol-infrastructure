---
# nginx config for the Studio web pod: serves static files and forwards
# everything else to granian.
#
# There is no webpack dev server here, unlike compose. The bundles are the
# ones baked into the image by the Dockerfile's node_builder stage, so JS
# and SCSS changes need a Tilt image rebuild rather than hot-reloading.
# See the ocw-studio section of local-dev/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocwstudio-nginx-conf
  namespace: ocw-studio
data:
  default.conf: |
    server {
        listen 8043 default_server;
        root /src;

        client_max_body_size 25M;

        location = /.well-known/dnt-policy.txt {
            return 204;
        }

        # Not compose's `try_files /static/images/favicon.ico /favicon.ico;`:
        # that worked only because compose bind-mounts the whole repo at /src,
        # so /src/static existed. Here the nginx container has just the
        # collected /src/staticfiles, the first path always missed, and the
        # /favicon.ico fallback re-entered this same exact-match location --
        # nginx died with "rewrite or internal redirection cycle" and every
        # favicon request returned 500. Terminate on =404 instead of looping.
        location = /favicon.ico {
            try_files /staticfiles/images/favicon.ico =404;
        }

        location ~* /static/(.*$) {
            expires max;
            add_header Access-Control-Allow-Origin *;
            try_files $uri $uri/ /staticfiles/$1 /staticfiles/$1/ =404;
        }

        location / {
            proxy_pass http://127.0.0.1:8041;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Hardcoded, like mit-learn and mitxonline: everything reaching
            # this sidecar came through APISIX, which terminated TLS, so
            # nginx's own $scheme (http) is not what the client used. Django
            # reads this via SECURE_PROXY_SSL_HEADER to build absolute URLs --
            # with $scheme it emitted http:// OIDC redirect_uris, which the
            # Keycloak client rejects as unregistered.
            proxy_set_header X-Forwarded-Proto https;
        }
    }
---
# nginx config for the site-host pod: serves published static sites straight
# out of the object store, one listener per bucket.
#
# This is a port of the :8044/:8045/:8046 server blocks in ocw-studio's
# config/nginx.conf. The rewrites are what make a bucket behave like a web
# server — without them a request for /courses/foo/ returns the bucket's XML
# listing instead of the page — so they are reproduced as-is. The only change
# is the upstream: the compose Minio container became the shared RustFS
# service, and the bucket names are inlined rather than substituted from env.
#
# No credentials are sent. The buckets are anonymously readable by bucket
# policy, applied by the RustFS bootstrap Job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocwstudio-sitehost-conf
  namespace: ocw-studio
data:
  default.conf: |
    # One listener per bucket, differing only in port and bucket name, so the
    # mapping lives in a `map` rather than in three copies of the same block.
    map $server_port $bucket {
        8044 ocw-content-draft-local;
        8045 ocw-content-live-local;
        8046 ocw-content-test;
    }

    # A named upstream rather than the hostname inline: proxy_pass below
    # contains a variable, so nginx resolves the host per request and would
    # need a `resolver`. An upstream name is resolved at startup instead.
    upstream rustfs {
        server rustfs.local-infra.svc.cluster.local:9000;
    }

    server {
        listen 8044 default_server;
        listen 8045 default_server;
        listen 8046 default_server;
        index index.html;

        # Keep the trailing-slash rewrite below from downgrading https
        # clients: nginx would otherwise build an absolute Location from
        # its own (http) scheme.
        absolute_redirect off;

        ignore_invalid_headers off;
        client_max_body_size 0;
        proxy_buffering off;

        location / {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $http_host;

            proxy_redirect off;
            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;

            location ~ ^/courses/.*/static_shared/.* {
                rewrite ^/courses/.*/static_shared/(.*)$ /static_shared/$1 last;
            }

            rewrite ^([^.]*[^/])$ $1/ permanent;
            rewrite /$ ${uri}index.html?${args} last;

            # $uri and the args are spelled out because once proxy_pass
            # contains a variable, nginx stops substituting the request path
            # onto the directive's URI and stops appending $args itself.
            # Verified to send byte-identical upstream paths to the three
            # separate server blocks this replaced, including the duplicated
            # query string the rewrite above produces.
            proxy_pass http://rustfs/$bucket$uri$is_args$args;
        }
    }

    # Published live course sites on the MIT Learn host, at
    # learn.mit.test/courses/o/<course-id>/. APISIX sends /courses/o/* and
    # /static_shared/* on that host here (ocwstudio-learn-courses-route).
    #
    # This is the local stand-in for Fastly's "Route OCW courses to S3" and
    # "Serve Learn 404 page for OCW requests" snippets
    # (src/ol_infrastructure/applications/mit_learn/). Studio publishes the
    # __OCW_LEARN_THEME__ extra theme to __OCW_LEARN_THEME__/courses/<id>/,
    # built with a /courses/o/<id> base URL (app-env.yaml), so the pages are
    # served exactly as published:
    # - /courses/o/ maps onto __OCW_LEARN_THEME__/courses/ in the live bucket
    # - a URL whose last segment has no extension gets index.html, since the
    #   bucket has no directory index
    # - the query string and cookies are dropped
    # - /static_shared/ is the theme assets build at the bucket root
    # - a missing course page gets MIT Learn's own 404 page
    #
    # The theme slug is filled in by the ocw-studio Tiltfile, which explains
    # why it is fixed to the one the production VCL hardcodes.
    server {
        listen 8047;
        absolute_redirect off;
        # Resolve the Next.js service per request, so this pod still starts
        # when mit-learn isn't enabled. The address is filled in from
        # /etc/resolv.conf at startup (NGINX_ENTRYPOINT_LOCAL_RESOLVERS).
        resolver ${NGINX_LOCAL_RESOLVERS} valid=30s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        location /static_shared/ {
            proxy_pass http://rustfs/ocw-content-live-local$uri;
        }

        location /courses/o/ {
            proxy_intercept_errors on;
            error_page 403 404 = @learn_not_found;

            # Both rewrites end in `break`: without it nginx would send the
            # changed URI back through location matching, into `location /`.
            rewrite ^/courses/o/((?:.*/)?[^./]+)/?$ /__OCW_LEARN_THEME__/courses/$1/index.html break;
            rewrite ^/courses/o/(.*)$ /__OCW_LEARN_THEME__/courses/$1 break;
            # Not appending $args drops the query string.
            proxy_pass http://rustfs/ocw-content-live-local$uri;
        }

        # Learn renders the page; the status stays 404. The Next.js router
        # headers are cleared so it returns HTML, not RSC component data.
        location @learn_not_found {
            set $learn_frontend mitlearn-nextjs.mit-learn.svc.cluster.local:3000;
            proxy_set_header Host $http_host;
            proxy_set_header RSC "";
            proxy_set_header Next-Router-State-Tree "";
            proxy_set_header Next-Router-Prefetch "";
            proxy_set_header Next-Router-Segment-Prefetch "";
            proxy_pass http://$learn_frontend/not-found;
        }

        location / {
            return 404;
        }
    }
