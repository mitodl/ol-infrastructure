---
# Placeholder Secrets for ocw-studio.
#
# Everything here is a local-dev literal, committed on purpose so the app comes
# up without manual setup — the same approach the other local-dev apps take.
# Real per-developer credentials (git tokens, Google Drive, YouTube) belong in
# the gitignored configmaps/app-env.local.yaml instead.
#
# The Keycloak client id/secret and realm public key are NOT here: the
# apps-infra Pulumi stack writes them into the ol-ocw-studio-oidc Secret, since
# the realm public key only exists once the realm does.
apiVersion: v1
kind: Secret
metadata:
  name: ocwstudio-secrets
  namespace: ocw-studio
type: Opaque
stringData:
  SECRET_KEY: "local-dev-ocw-studio-unsafe-key"  # pragma: allowlist secret
  API_BEARER_TOKEN: "local-dev-api-bearer-token"  # pragma: allowlist secret

  DATABASE_URL: "postgres://app:localdev@local-pg-rw.local-infra.svc.cluster.local:5432/ocwstudio"  # pragma: allowlist secret

  # Compose used redis db 4 for both; valkey here is shared with the other
  # apps, which take db 0-2, so ocw-studio gets 4 and 5.
  CELERY_BROKER_URL: "redis://valkey.local-infra.svc.cluster.local:6379/4"
  CELERY_RESULT_BACKEND: "redis://valkey.local-infra.svc.cluster.local:6379/5"
  REDIS_URL: "redis://valkey.local-infra.svc.cluster.local:6379/5"

  # RustFS credentials. Must match ACCESS_KEY/SECRET_KEY in
  # local-dev/infra/modules/objectstore.py.
  AWS_ACCESS_KEY_ID: "localdevaccess"
  AWS_SECRET_ACCESS_KEY: "localdevsecret123"  # pragma: allowlist secret

  # Concourse local user, matching CONCOURSE_ADD_LOCAL_USER in concourse.yaml.
  CONCOURSE_USERNAME: "test"
  CONCOURSE_PASSWORD: "test"  # pragma: allowlist secret

  # Placeholder — set a real one in app-env.local.yaml to sync a git repo.
  GIT_TOKEN: "changeme"  # pragma: allowlist secret
  GITHUB_WEBHOOK_KEY: "local-dev-webhook-key"  # pragma: allowlist secret
  OPEN_CATALOG_WEBHOOK_KEY: "local-dev-catalog-key"  # pragma: allowlist secret
