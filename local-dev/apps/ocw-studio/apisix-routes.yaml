---
# APISIX shared plugin config for ocw-studio routes.
apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: ocwstudio-shared-plugins
  namespace: ocw-studio
spec:
  plugins:
  - name: redirect
    enable: true
    config:
      http_to_https: true
  - name: prometheus
    enable: true
---
# Same as the shared config above, minus the HTTP->HTTPS redirect, for the
# published-site hosts.
#
# Concourse task containers build those sites and fetch the static JSON API
# back out of them over HTTP. They carry only public CAs, so they cannot verify
# the local mkcert cert, and forcing them to HTTPS made every instructor fetch
# fail with "certificate signed by unknown authority". The redirect also
# pointed at :9443, which is not exposed, so following it just timed out.
#
# Serving these hosts over plain HTTP as well keeps the hostname identical to
# what a browser uses, so a URL baked into built output stays valid either way.
# HTTPS still works for browsers; it is simply no longer mandatory.
apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: ocwstudio-site-plugins
  namespace: ocw-studio
spec:
  plugins:
  - name: prometheus
    enable: true
---
# TLS for every ocw-studio hostname. All are covered by the *.ocw.<domain>
# wildcard that setup.sh adds to the mkcert cert.
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: ocwstudio-tls
  namespace: ocw-studio
spec:
  ingressClassName: apache-apisix
  hosts:
  - studio.ocw.mit.dev
  - draft.ocw.mit.dev
  - live.ocw.mit.dev
  - test.ocw.mit.dev
  - concourse.ocw.mit.dev
  secret:
    name: local-dev-tls
    namespace: ocw-studio
---
# Studio itself.
#
# No openid-connect plugin here, unlike mit-learn and mitxonline: ocw-studio
# authenticates in Django with python-social-auth's KeycloakOAuth2 backend and
# handles the whole OIDC exchange itself. APISIX just terminates TLS and
# forwards. Its Keycloak client and the realm public key arrive through the
# ol-ocw-studio-oidc Secret instead.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: ocwstudio-route
  namespace: ocw-studio
spec:
  ingressClassName: apache-apisix
  http:
  - name: studio
    priority: 0
    match:
      hosts:
      - studio.ocw.mit.dev
      paths:
      - "/*"
    backends:
    - serviceName: ocwstudio-webapp
      servicePort: 8043
    plugin_config_name: ocwstudio-shared-plugins
    plugins:
    # Video and resource uploads go through Studio rather than straight to the
    # object store, so the default 1MB body limit is far too small.
    - name: client-control
      enable: true
      config:
        max_body_size: 1073741824
---
# Published sites, served from the object store by the site-host nginx.
#
# draft is what "Publish draft" writes, live is "Publish live", and test is the
# bucket the pipeline's smoke-test step reads back. These are plain static
# sites with no auth: the buckets behind them are world-readable, matching how
# published OCW content works in production.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: ocwstudio-sites-route
  namespace: ocw-studio
spec:
  ingressClassName: apache-apisix
  http:
  - name: draft
    priority: 0
    match:
      hosts:
      - draft.ocw.mit.dev
      paths:
      - "/*"
    backends:
    - serviceName: ocwstudio-sitehost
      servicePort: 8044
    plugin_config_name: ocwstudio-site-plugins

  - name: live
    priority: 0
    match:
      hosts:
      - live.ocw.mit.dev
      paths:
      - "/*"
    backends:
    - serviceName: ocwstudio-sitehost
      servicePort: 8045
    plugin_config_name: ocwstudio-site-plugins

  - name: test
    priority: 0
    match:
      hosts:
      - test.ocw.mit.dev
      paths:
      - "/*"
    backends:
    - serviceName: ocwstudio-sitehost
      servicePort: 8046
    plugin_config_name: ocwstudio-site-plugins
---
# Concourse web UI. Studio links build pages here and embeds them, so the
# hostname has to match CONCOURSE_EXTERNAL_URL in concourse.yaml.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: ocwstudio-concourse-route
  namespace: ocw-studio
spec:
  ingressClassName: apache-apisix
  http:
  - name: concourse
    priority: 0
    match:
      hosts:
      - concourse.ocw.mit.dev
      paths:
      - "/*"
    backends:
    - serviceName: ocwstudio-concourse
      servicePort: 8080
    plugin_config_name: ocwstudio-shared-plugins
    plugins:
    # Pipeline configs and build logs are both larger than the default cap.
    - name: client-control
      enable: true
      config:
        max_body_size: 268435456
