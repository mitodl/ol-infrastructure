---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mitxonline-env
  namespace: mitxonline
data:
  DJANGO_SETTINGS_MODULE: "main.settings"
  MITX_ONLINE_BASE_URL: "https://mitxonline.mit.dev"
  MITXONLINE_DOCKER_BASE_URL: "https://mitxonline.mit.dev"

  # Redirect target for a first-time login (GatewayLoginView sends users whose
  # profile has completed_onboarding=False here); defaults to a legacy
  # mitxonline.odl.local:8013 host, which doesn't resolve in this stack.
  MITXONLINE_NEW_USER_LOGIN_URL: "https://mitxonline.mit.dev/create-profile"

  # The trailing "&" is deliberate: the view appends "?redirect_url=..." to this
  # value, and it keeps no_redirect parsing as exactly "1".
  # If the openedx app is ever enabled here, change this to
  # https://lms.mit.dev/logout to match how the deployed envs do it.
  LOGOUT_REDIRECT_URL: "https://mitxonline.mit.dev/logout?no_redirect=1&"
  MITX_ONLINE_DB_DISABLE_SSL: "True"
  MITX_ONLINE_USE_S3: "False"
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  USE_X_FORWARDED_HOST: "True"
  USE_X_FORWARDED_PORT: "True"

  # mkcert root CA — trusts the local wildcard TLS cert for inter-pod HTTPS
  REQUESTS_CA_BUNDLE: "/etc/ssl/local-dev/rootCA.pem"
  SSL_CERT_FILE: "/etc/ssl/local-dev/rootCA.pem"

  # Site config
  SITE_NAME: "MITx Online"
  MITX_ONLINE_ENVIRONMENT: "local"
  MITX_ONLINE_ADMIN_EMAIL: "admin@odl.local"
  MITX_ONLINE_FROM_EMAIL: "MIT Learn <mitlearn-support@mit.edu>"
  MITX_ONLINE_REPLY_TO_ADDRESS: "MIT Learn <mitlearn-support@mit.edu>"
  MITX_ONLINE_SUPPORT_EMAIL: "mitlearn-support@mit.edu"
  MITX_ONLINE_OAUTH_PROVIDER: "mitxonline-oauth2"
  MITX_ONLINE_SECURE_SSL_REDIRECT: "False"
  EXPOSE_OIDC_LOGIN: "True"

  # Keycloak
  KEYCLOAK_BASE_URL: "https://sso.ol.mit.dev"
  KEYCLOAK_REALM_NAME: "olapps"
  KEYCLOAK_DISCOVERY_URL: "https://sso.ol.mit.dev/realms/olapps/.well-known/openid-configuration"

  # Enable the APISIX user middleware: it reads the X-Userinfo header APISIX
  # injects and authenticates (and auto-creates) the Django user. Defaults to
  # True (disabled), which leaves every request anonymous. Production sets this.
  MITOL_APIGATEWAY_DISABLE_MIDDLEWARE: "false"
  # Required for Django's CSRF origin check on POSTs behind HTTPS (e.g. the
  # admin login form); defaults to empty, which rejects them with DEBUG=False.
  CSRF_TRUSTED_ORIGINS: "https://mitxonline.mit.dev,https://learn.mit.dev"

  # Valkey
  # Each app needs its own Valkey DBs, or Celery and RedBeat pick up another
  # app's tasks. In use: mit-learn 0-2, Open edX 3 (cache) and 12 (broker),
  # ocw-studio 4-5, mitxonline 6-7, learn-ai 8-9, odl-video-service 10-11.
  REDIS_URL: "redis://valkey.local-infra.svc.cluster.local:6379/6"
  CELERY_BROKER_URL: "redis://valkey.local-infra.svc.cluster.local:6379/7"
  CELERY_RESULT_BACKEND: "redis://valkey.local-infra.svc.cluster.local:6379/7"

  # Email
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "mailpit.local-infra.svc.cluster.local"
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "False"

  # Required mitxonline email vars (stub values for local dev — email not sent)
  MAILGUN_SENDER_DOMAIN: "local.dev"
  MAILGUN_KEY: "local-dev-stub-mailgun-key"
  # Required OpenEdX API credentials (stub — OpenEdX integration degraded locally)
  OPENEDX_API_CLIENT_ID: "local-dev-openedx-client-id" # pragma: allowlist secret
  OPENEDX_API_CLIENT_SECRET: "local-dev-openedx-client-secret" # pragma: allowlist secret

  # ── Open edX hostnames ─────────────────────────────────────────────────────
  # Every one of these has a hardcoded *devstack* default in mitxonline's
  # main/settings.py (edx.odl.local:18000, studio.edx.odl.local:18001). Those
  # hosts do not exist in this cluster, so leaving them unset is not "degraded"
  # — it emits dead links into the UI and fails every server-side call. The
  # Open edX composed in here is lehrer's, served by APISIX on the hosts
  # declared in apps/openedx/configmaps/lms-config.yaml (LMS_BASE/CMS_BASE).
  #
  # OPENEDX_COURSE_BASE_URL is listed separately on purpose: it does NOT derive
  # from OPENEDX_API_BASE_URL, it carries its own devstack default. It is what
  # CourseRun.courseware_url is built from, so it is the one that puts
  # http://edx.odl.local:18000/learn/course/... behind every "go to course" link
  # on the MIT Learn and mitxonline dashboards.
  #
  # Only its scheme and host are used. courses/utils.py get_courseware_url does
  # urljoin(OPENEDX_COURSE_BASE_URL, COURSEWARE_URL_PATTERN_TEMPLATE), and that
  # template ("/learn/course/{courseware_id}/home", courses/constants.py) is
  # root-relative, so urljoin discards whatever path this value carries. Giving
  # it a path would only imply a configurability that does not exist -- the
  # /learn/... shape is hardcoded in mitxonline and cannot be pointed at the
  # LMS's legacy /courses/<id>/course/ courseware.
  #
  # 'mit.dev' is rewritten to LOCAL_DEV_ROOT_DOMAIN by k8s_yaml_local.
  OPENEDX_API_BASE_URL: "https://lms.mit.dev"
  OPENEDX_COURSE_BASE_URL: "https://lms.mit.dev"
  OPENEDX_STUDIO_API_BASE_URL: "https://studio.mit.dev"
  # OPENEDX_BASE_REDIRECT_URL is deliberately absent: its default is
  # OPENEDX_API_BASE_URL, so it follows the value above.

  # Unified Ecommerce (optional — disable if not running)
  UNIFIED_ECOMMERCE_URL: ""

  # CyberSource sandbox endpoint (paired with the stub creds in secrets.yaml —
  # see the comment there for why these are needed at all).
  MITOL_PAYMENT_GATEWAY_CYBERSOURCE_SECURE_ACCEPTANCE_URL: "https://testsecureacceptance.cybersource.com/pay"
