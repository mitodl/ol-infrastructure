---
# Local values for mitxonline's secret-backed variables. Deployed stacks read
# these variables from Vault, as described in
# src/ol_infrastructure/applications/mitxonline/vault_secrets.py; the program
# writes the ones under `values:` into the mitxonline-secrets Secret. Every
# described variable is named exactly once, under `values:`, `unset:` or
# `supplied_by:`, and the program stops otherwise, so a variable added to the
# description needs a decision here. mit.test is swapped for the cluster's root domain.
values:
  DATABASE_URL: "postgres://app:localdev@local-pg-rw.local-infra.svc.cluster.local:5432/mitxonline"  # pragma: allowlist secret
  SECRET_KEY: "local-dev-mitxonline-insecure-secret-key"  # pragma: allowlist secret
  KEYCLOAK_DISCOVERY_URL: "https://sso.ol.mit.test/realms/olapps/.well-known/openid-configuration"
  # Stub: EMAIL_BACKEND in the program's env sends to Mailpit, never Mailgun.
  MAILGUN_KEY: "local-dev-stub-mailgun-key"  # pragma: allowlist secret
  # Required Open edX API credentials (stubs; the Open edX integration is
  # degraded locally).
  OPENEDX_API_CLIENT_ID: "local-dev-openedx-client-id"  # pragma: allowlist secret
  OPENEDX_API_CLIENT_SECRET: "local-dev-openedx-client-secret"  # pragma: allowlist secret
  # Bearer token for the LMS enrollment API, sent verbatim (no OAuth exchange:
  # get_edx_api_service_client passes it straight through as access_token). It
  # must match OPENEDX_SERVICE_WORKER_API_TOKEN in
  # apps/openedx/configmaps/lms-config.yaml, which is what edxapp-provision
  # creates the AccessToken from.
  #
  # A value the LMS does not hold makes every enrollment push 401 and leaves
  # learners at edx_enrolled=False with no courseware.
  OPENEDX_SERVICE_WORKER_API_TOKEN: "local-dev-stub-token"  # pragma: allowlist secret
  # Placeholders, not real creds. Without these,
  # MITOL_PAYMENT_GATEWAY_CYBERSOURCE_SECURITY_KEY defaults to None and the
  # checkout flow's HMAC signing crashes with AttributeError before it can
  # redirect to CyberSource. To actually test checkout, put real CyberSource
  # test/sandbox credentials (e.g. sops-decrypt the `cybersource:` block in
  # src/bridge/secrets/mitxonline/secrets.ci.yaml) under mitxonline:vars in the
  # gitignored stack file pulumi/Pulumi.Dev.yaml. The program merges it into
  # each container's env:, which beats this Secret's envFrom. See "Local
  # Configuration Overrides" in local-dev/README.md.
  MITOL_PAYMENT_GATEWAY_CYBERSOURCE_ACCESS_KEY: "REPLACE-WITH-REAL-CYBERSOURCE-TEST-ACCESS-KEY"  # pragma: allowlist secret
  MITOL_PAYMENT_GATEWAY_CYBERSOURCE_SECURITY_KEY: "REPLACE-WITH-REAL-CYBERSOURCE-TEST-SECURITY-KEY"  # pragma: allowlist secret
  MITOL_PAYMENT_GATEWAY_CYBERSOURCE_PROFILE_ID: "REPLACE-WITH-REAL-CYBERSOURCE-TEST-PROFILE-ID"
# Not set locally, so the app's own default applies. An empty string is not
# the same: most of these default to None.
unset:
- AWS_ACCESS_KEY_ID
- AWS_SECRET_ACCESS_KEY
- CYBERSOURCE_INQUIRY_LOG_NACL_ENCRYPTION_KEY
- HUBSPOT_HOME_PAGE_FORM_GUID
- HUBSPOT_PORTAL_ID
- MAILGUN_WEBHOOK_SIGNING_SECRET
- MITOL_GOOGLE_SHEETS_DRIVE_API_PROJECT_ID
- MITOL_GOOGLE_SHEETS_DRIVE_CLIENT_ID
- MITOL_GOOGLE_SHEETS_DRIVE_CLIENT_SECRET
- MITOL_GOOGLE_SHEETS_ENROLLMENT_CHANGE_SHEET_ID
- MITOL_HUBSPOT_API_PRIVATE_TOKEN
- MITOL_PAYMENT_GATEWAY_CYBERSOURCE_MERCHANT_ID
- MITOL_PAYMENT_GATEWAY_CYBERSOURCE_MERCHANT_SECRET
- MITOL_PAYMENT_GATEWAY_CYBERSOURCE_MERCHANT_SECRET_KEY_ID
- MITOL_PAYMENT_GATEWAY_STRIPE_API_KEY
- MITOL_SCIM_KEYCLOAK_CLIENT_ID
- MITOL_SCIM_KEYCLOAK_CLIENT_SECRET
- MITX_ONLINE_FASTLY_API_KEY
- MITX_ONLINE_FASTLY_AUTH_TOKEN
- MITX_ONLINE_FASTLY_SERVICE_ID
- MITX_ONLINE_REFINE_OIDC_CONFIG_CLIENT_ID
- MITX_ONLINE_REGISTRATION_ACCESS_TOKEN
- MIT_LEARN_FASTLY_SERVICE_ID
- OIDC_RSA_PRIVATE_KEY
- OPENEDX_COURSES_SERVICE_WORKER_CLIENT_ID
- OPENEDX_COURSES_SERVICE_WORKER_CLIENT_SECRET
- OPENEDX_RETIREMENT_SERVICE_WORKER_CLIENT_ID
- OPENEDX_RETIREMENT_SERVICE_WORKER_CLIENT_SECRET
- OPEN_EXCHANGE_RATES_APP_ID
- POSTHOG_API_TOKEN
- POSTHOG_PROJECT_API_KEY
- RECAPTCHA_SECRET_KEY
- RECAPTCHA_SITE_KEY
- SENTRY_DSN
- STATUS_TOKEN
- TRINO_CATALOG
- TRINO_HOST
- TRINO_PASSWORD
- TRINO_PORT
- TRINO_USER
- UAI_MITOL_HUBSPOT_API_PRIVATE_TOKEN
- VERIFIABLE_CREDENTIAL_BEARER_TOKEN
- VERIFIABLE_CREDENTIAL_DID
# Set locally, but by another Secret the workloads also mount, so not written
# into mitxonline-secrets. mitxonline-b2b-client holds the realm-management
# roles the admin API needs; apps-infra writes its pair into
# mitxonline-keycloak-admin.
supplied_by:
  KEYCLOAK_ADMIN_CLIENT_ID: mitxonline-keycloak-admin
  KEYCLOAK_ADMIN_CLIENT_SECRET: mitxonline-keycloak-admin  # pragma: allowlist secret
  KEYCLOAK_ADMIN_CLIENT_SCOPES: mitxonline-keycloak-admin
  KEYCLOAK_ADMIN_CLIENT_NO_VERIFY_SSL: mitxonline-keycloak-admin
