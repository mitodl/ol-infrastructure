---
apiVersion: v1
kind: Secret
metadata:
  name: mitxonline-secrets
  namespace: mitxonline
type: Opaque
stringData:
  SECRET_KEY: "local-dev-mitxonline-insecure-secret-key"  # pragma: allowlist secret
  DATABASE_URL: "postgres://app:localdev@local-pg-rw.local-infra.svc.cluster.local:5432/mitxonline"  # pragma: allowlist secret
  # Django's own Keycloak client (account actions; locally also the admin API). Gateway login uses the mit-learn client.
  KEYCLOAK_CLIENT_ID: "ol-mitxonline-client"
  KEYCLOAK_CLIENT_SECRET: "local-dev-mitxonline-secret"  # pragma: allowlist secret
  # Admin Keycloak client (for user management APIs)
  KEYCLOAK_ADMIN_CLIENT_ID: "ol-mitxonline-client"
  KEYCLOAK_ADMIN_CLIENT_SECRET: "local-dev-mitxonline-secret"  # pragma: allowlist secret
  # Bearer token for the LMS enrollment API, sent verbatim (no OAuth exchange:
  # get_edx_api_service_client passes it straight through as access_token). It
  # must match OPENEDX_SERVICE_WORKER_API_TOKEN in
  # apps/openedx/configmaps/lms-config.yaml, which is what edxapp-provision
  # creates the AccessToken from.
  #
  # A value the LMS does not hold makes every enrollment push 401 and leaves
  # learners at edx_enrolled=False with no courseware.
  OPENEDX_SERVICE_WORKER_API_TOKEN: "local-dev-stub-token"  # pragma: allowlist secret
  # Placeholders, not real creds. Without these,
  # MITOL_PAYMENT_GATEWAY_CYBERSOURCE_SECURITY_KEY defaults to None and the
  # checkout flow's HMAC signing crashes with AttributeError before it can
  # redirect to CyberSource. To actually test checkout, put real CyberSource
  # test/sandbox credentials (e.g. sops-decrypt the `cybersource:` block in
  # src/bridge/secrets/mitxonline/secrets.ci.yaml) under mitxonline:vars in the
  # gitignored stack file pulumi/Pulumi.Dev.yaml — the program merges it into
  # each container's env:, which beats this Secret's envFrom. See "Local
  # Configuration Overrides" in local-dev/README.md.
  MITOL_PAYMENT_GATEWAY_CYBERSOURCE_ACCESS_KEY: "REPLACE-WITH-REAL-CYBERSOURCE-TEST-ACCESS-KEY"  # pragma: allowlist secret
  MITOL_PAYMENT_GATEWAY_CYBERSOURCE_SECURITY_KEY: "REPLACE-WITH-REAL-CYBERSOURCE-TEST-SECURITY-KEY"  # pragma: allowlist secret
  MITOL_PAYMENT_GATEWAY_CYBERSOURCE_PROFILE_ID: "REPLACE-WITH-REAL-CYBERSOURCE-TEST-PROFILE-ID"
