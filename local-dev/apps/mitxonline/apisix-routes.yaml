---
apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: mitxonline-shared-plugins
  namespace: mitxonline
spec:
  plugins:
  - name: redirect
    enable: true
    config:
      http_to_https: true
  - name: cors
    enable: true
    config:
      allow_origins: "https://mitxonline.mit.dev,https://learn.mit.dev"
      allow_methods: "GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS"
      allow_headers: "Authorization,Content-Type,X-CSRFToken,X-Requested-With"
      expose_headers: "X-CSRFToken"
      allow_credential: true
      max_age: 3600
  - name: response-rewrite
    enable: true
    config:
      headers:
        set:
          Referrer-Policy: "origin"
          # Mirrors response_rewrite_plugin_config in
          # src/ol_infrastructure/applications/mitxonline/__main__.py.  Without
          # it local-dev silently permits framing that production refuses, so a
          # logout fan-out would pass here and fail in production.
          #
          # lms.mit.dev frames our /logout?no_redirect=1 during its own logout
          # fan-out; api.learn.mit.dev is above it in the chain once Learn's
          # logout interstitial frames lms (hq#12763), and frame-ancestors is
          # checked against every ancestor, not just the immediate parent.
          Content-Security-Policy: >-
            frame-ancestors 'self' https://lms.mit.dev https://api.learn.mit.dev
  - name: prometheus
    enable: true
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: mitxonline-tls
  namespace: mitxonline
spec:
  ingressClassName: apache-apisix
  hosts:
  - "mitxonline.mit.dev"
  - "api.mitxonline.mit.dev"
  secret:
    name: local-dev-tls
    namespace: mitxonline
---
# ApisixRoute for mitxonline.mit.dev and api.mitxonline.mit.dev.
#
# Sub-routes match QA pattern:
#   passauth        : /*              (pass — injects X-Userinfo if session present)
#   logout-redirect : /logout/oidc/* (redirect to /logout/oidc)
#   reqauth         : /login/*, /admin/login/*, /login*, /login/oidc*
#   cart            : /cart, /cart/, /cart/* (require authentication, priority 20)
#
# No explicit redirect_uri — lua-resty-openidc auto-derives it.
# session.cookie.domain set to .mitxonline.mit.dev so the cookie is shared
# between the frontend (mitxonline.mit.dev) and API (api.mitxonline.mit.dev).
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: mitxonline-route
  namespace: mitxonline
spec:
  ingressClassName: apache-apisix
  http:
  - name: passauth
    priority: 0
    match:
      hosts:
      - "mitxonline.mit.dev"
      - "api.mitxonline.mit.dev"
      paths:
      - "/*"
    backends:
    - serviceName: mitxonline-webapp
      servicePort: 8010
    plugin_config_name: mitxonline-shared-plugins
    plugins:
    - name: openid-connect
      enable: true
      secretRef: ol-mitxonline-oidc     # pragma: allowlist secret
      config:
        discovery: "http://keycloak-service.local-infra.svc.cluster.local:8080/realms/olapps/.well-known/openid-configuration"
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_basic
        scope: "openid profile email organization:*"
        ssl_verify: false
        renew_access_token_on_expiry: true
        logout_path: "/logout/oidc"
        post_logout_redirect_uri: "https://mitxonline.mit.dev/logout/"
        session:
          secret: "local-dev-oidc-session-secret-32chars!"     # pragma: allowlist secret
          # Flat keys, matching OLApisixOIDCConfig.  lua-resty-session 4.x on
          # APISIX 3.17+ reads only these; the nested `cookie:` form this used to
          # use is silently ignored, which left the cookie host-only and gave
          # mitxonline.mit.dev and api.mitxonline.mit.dev separate sessions.
          cookie_domain: ".mitxonline.mit.dev"
          # Named as in production so the two gateway sessions are telling apart
          # in devtools rather than both showing as "session".
          cookie_name: "mitxonline_apisix_session"
          absolute_timeout: 1209600
          idling_timeout: 0
          rolling_timeout: 0
        session_contents:
          access_token: true
          enc_id_token: true
          id_token: true
          user: true
        unauth_action: pass

  - name: logout-redirect
    priority: 10
    match:
      hosts:
      - "mitxonline.mit.dev"
      - "api.mitxonline.mit.dev"
      paths:
      - "/logout/oidc/*"
    backends:
    - serviceName: mitxonline-webapp
      servicePort: 8010
    plugin_config_name: mitxonline-shared-plugins
    plugins:
    - name: redirect
      enable: true
      config:
        uri: "/logout/oidc"

  - name: reqauth
    priority: 10
    match:
      hosts:
      - "mitxonline.mit.dev"
      - "api.mitxonline.mit.dev"
      paths:
      - "/login/*"
      - "/admin/login/*"
      - "/login*"
      - "/login/oidc*"
    backends:
    - serviceName: mitxonline-webapp
      servicePort: 8010
    plugin_config_name: mitxonline-shared-plugins
    plugins:
    - name: openid-connect
      enable: true
      secretRef: ol-mitxonline-oidc     # pragma: allowlist secret
      config:
        discovery: "http://keycloak-service.local-infra.svc.cluster.local:8080/realms/olapps/.well-known/openid-configuration"
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_basic
        scope: "openid profile email organization:*"
        ssl_verify: false
        renew_access_token_on_expiry: true
        logout_path: "/logout/oidc"
        post_logout_redirect_uri: "https://mitxonline.mit.dev/logout/"
        session:
          secret: "local-dev-oidc-session-secret-32chars!"     # pragma: allowlist secret
          # Flat keys, matching OLApisixOIDCConfig.  lua-resty-session 4.x on
          # APISIX 3.17+ reads only these; the nested `cookie:` form this used to
          # use is silently ignored, which left the cookie host-only and gave
          # mitxonline.mit.dev and api.mitxonline.mit.dev separate sessions.
          cookie_domain: ".mitxonline.mit.dev"
          # Named as in production so the two gateway sessions are telling apart
          # in devtools rather than both showing as "session".
          cookie_name: "mitxonline_apisix_session"
          absolute_timeout: 1209600
          idling_timeout: 0
          rolling_timeout: 0
        session_contents:
          access_token: true
          enc_id_token: true
          id_token: true
          user: true
        unauth_action: auth

  # Session reset for hand-offs from MIT Learn (hq#12763).  Mirrors the
  # "switch-session" route in
  # src/ol_infrastructure/applications/mitxonline/__main__.py.
  #
  # No openid-connect plugin on purpose: it would validate, and possibly
  # refresh, the very session this route exists to discard.  The
  # serverless-post-function expires the gateway session cookie on the way out,
  # so the redirect Django issues lands on "cart" below with no session, runs a
  # fresh authorization-code flow, and comes back as whoever currently holds the
  # Keycloak SSO session.
  - name: switch-session
    priority: 20
    match:
      hosts:
      - "mitxonline.mit.dev"
      - "api.mitxonline.mit.dev"
      paths:
      - "/switch-session"
      - "/switch-session/"
    backends:
    - serviceName: mitxonline-webapp
      servicePort: 8010
    plugin_config_name: mitxonline-shared-plugins
    plugins:
    - name: serverless-post-function
      enable: true
      config:
        # header_filter, not the default log phase: response headers are still
        # mutable there.
        phase: header_filter
        functions:
        - |
          return function(conf, ctx)
              local cookie = ngx.var.http_cookie
              if not cookie then
                  return
              end
              local core = require("apisix.core")
              for pair in cookie:gmatch("[^;]+") do
                  local name = pair:match("^%s*([^=%s]+)=")
                  if name and (name == "mitxonline_apisix_session"
                               or name:match("^mitxonline_apisix_session_%d+$")) then
                      core.response.add_header("Set-Cookie", name .. "=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax")
                      core.response.add_header("Set-Cookie", name .. "=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax; Domain=.mitxonline.mit.dev")
                  end
              end
          end

  - name: cart
    priority: 20
    match:
      hosts:
      - "mitxonline.mit.dev"
      - "api.mitxonline.mit.dev"
      paths:
      - "/cart"
      - "/cart/"
      - "/cart/*"
    backends:
    - serviceName: mitxonline-webapp
      servicePort: 8010
    plugin_config_name: mitxonline-shared-plugins
    plugins:
    - name: openid-connect
      enable: true
      secretRef: ol-mitxonline-oidc     # pragma: allowlist secret
      config:
        discovery: "http://keycloak-service.local-infra.svc.cluster.local:8080/realms/olapps/.well-known/openid-configuration"
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_basic
        scope: "openid profile email organization:*"
        ssl_verify: false
        renew_access_token_on_expiry: true
        logout_path: "/logout/oidc"
        post_logout_redirect_uri: "https://mitxonline.mit.dev/logout/"
        session:
          secret: "local-dev-oidc-session-secret-32chars!"     # pragma: allowlist secret
          # Flat keys, matching OLApisixOIDCConfig.  lua-resty-session 4.x on
          # APISIX 3.17+ reads only these; the nested `cookie:` form this used to
          # use is silently ignored, which left the cookie host-only and gave
          # mitxonline.mit.dev and api.mitxonline.mit.dev separate sessions.
          cookie_domain: ".mitxonline.mit.dev"
          # Named as in production so the two gateway sessions are telling apart
          # in devtools rather than both showing as "session".
          cookie_name: "mitxonline_apisix_session"
          absolute_timeout: 1209600
          idling_timeout: 0
          rolling_timeout: 0
        session_contents:
          access_token: true
          enc_id_token: true
          id_token: true
          user: true
        unauth_action: auth
---
# ─────────────────────────────────────────────────────────────────────────────
# Learn → mitxonline API proxy (mirrors production).
# In production this is
# mitxonline_apisix_route_prefix in
# src/ol_infrastructure/applications/mitxonline/__main__.py.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: mitxonline-learn-proxy-route
  namespace: mitxonline
spec:
  ingressClassName: apache-apisix
  http:
  - name: passauth
    priority: 0
    match:
      hosts:
      - api.learn.mit.dev
      paths:
      - "/mitxonline/*"
    backends:
    - serviceName: mitxonline-webapp
      servicePort: 8010
    plugin_config_name: mitxonline-shared-plugins
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - "^/mitxonline/(.*)"
        - "/$1"
    - name: openid-connect
      enable: true
      # Same mitlearn client as the learn route (must match for session/token
      # refresh); secretRef avoids a second inlined copy of the secret.
      secretRef: ol-mitlearn-oidc     # pragma: allowlist secret
      config:
        discovery: "http://keycloak-service.local-infra.svc.cluster.local:8080/realms/olapps/.well-known/openid-configuration"
        realm: olapps
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_post
        scope: "openid profile email ol-profile"
        ssl_verify: false
        renew_access_token_on_expiry: true
        # Must match the learn route that issued the cookie, exactly -- a
        # mismatch turns this unauth_action=pass route anonymous.
        session:
          secret: "local-dev-oidc-session-secret-32chars!"     # pragma: allowlist secret
          cookie_name: "mitlearn_apisix_session"
          absolute_timeout: 1209600
          idling_timeout: 0
          rolling_timeout: 0
        unauth_action: pass
