---
apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: mitxonline-shared-plugins
  namespace: mitxonline
spec:
  plugins:
  - name: redirect
    enable: true
    config:
      http_to_https: true
  - name: cors
    enable: true
    config:
      allow_origins: "https://mitxonline.mit.test,https://learn.mit.test"
      allow_methods: "GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS"
      allow_headers: "Authorization,Content-Type,X-CSRFToken,X-Requested-With"
      expose_headers: "X-CSRFToken"
      allow_credential: true
      max_age: 3600
  - name: response-rewrite
    enable: true
    config:
      headers:
        set:
          Referrer-Policy: "origin"
  - name: prometheus
    enable: true
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: mitxonline-tls
  namespace: mitxonline
spec:
  ingressClassName: apache-apisix
  hosts:
  - "mitxonline.mit.test"
  - "api.mitxonline.mit.test"
  secret:
    name: local-dev-tls
    namespace: mitxonline
---
# ApisixRoute for mitxonline.mit.test and api.mitxonline.mit.test.
#
# Sub-routes match QA pattern:
#   passauth        : /*              (pass — injects X-Userinfo if session present)
#   logout-redirect : /logout/oidc/* (redirect to /logout/oidc)
#   reqauth         : /login/*, /admin/login/*, /login*, /login/oidc*
#   cart            : /cart, /cart/, /cart/* (require authentication, priority 20)
#
# No explicit redirect_uri — lua-resty-openidc auto-derives it.
# session.cookie.domain set to .mitxonline.mit.test so the cookie is shared
# between the frontend (mitxonline.mit.test) and API (api.mitxonline.mit.test).
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: mitxonline-route
  namespace: mitxonline
spec:
  ingressClassName: apache-apisix
  http:
  - name: passauth
    priority: 0
    match:
      hosts:
      - "mitxonline.mit.test"
      - "api.mitxonline.mit.test"
      paths:
      - "/*"
    backends:
    - serviceName: mitxonline-webapp
      servicePort: 8010
    plugin_config_name: mitxonline-shared-plugins
    plugins:
    # secretRef supplies client_id, client_secret, realm, discovery and
    # session.secret (_make_oidc_secret in local-dev/infra/modules/keycloak.py);
    # the ingress controller merges it over config, so those keys are not
    # repeated inline.
    - name: openid-connect
      enable: true
      secretRef: ol-mitxonline-oidc     # pragma: allowlist secret
      config:
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_basic
        scope: "openid profile email organization:*"
        ssl_verify: false
        renew_access_token_on_expiry: true
        logout_path: "/logout/oidc"
        post_logout_redirect_uri: "https://mitxonline.mit.test/logout/"
        session:
          # Flat keys: APISIX 3.17+ ignores the nested session.cookie.* form.
          # 0 disables lua-resty-session's 900s idling / 3600s rolling
          # defaults, leaving absolute_timeout in charge, as deployed.
          cookie_domain: ".mitxonline.mit.test"
          absolute_timeout: 1209600
          idling_timeout: 0
          rolling_timeout: 0
        session_contents:
          access_token: true
          enc_id_token: true
          id_token: true
          user: true
        unauth_action: pass

  - name: logout-redirect
    priority: 10
    match:
      hosts:
      - "mitxonline.mit.test"
      - "api.mitxonline.mit.test"
      paths:
      - "/logout/oidc/*"
    backends:
    - serviceName: mitxonline-webapp
      servicePort: 8010
    plugin_config_name: mitxonline-shared-plugins
    plugins:
    - name: redirect
      enable: true
      config:
        uri: "/logout/oidc"

  - name: reqauth
    priority: 10
    match:
      hosts:
      - "mitxonline.mit.test"
      - "api.mitxonline.mit.test"
      paths:
      - "/login/*"
      - "/admin/login/*"
      - "/login*"
      - "/login/oidc*"
    backends:
    - serviceName: mitxonline-webapp
      servicePort: 8010
    plugin_config_name: mitxonline-shared-plugins
    plugins:
    - name: openid-connect
      enable: true
      secretRef: ol-mitxonline-oidc     # pragma: allowlist secret
      config:
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_basic
        scope: "openid profile email organization:*"
        ssl_verify: false
        renew_access_token_on_expiry: true
        logout_path: "/logout/oidc"
        post_logout_redirect_uri: "https://mitxonline.mit.test/logout/"
        session:
          # Flat keys: APISIX 3.17+ ignores the nested session.cookie.* form.
          # 0 disables lua-resty-session's 900s idling / 3600s rolling
          # defaults, leaving absolute_timeout in charge, as deployed.
          cookie_domain: ".mitxonline.mit.test"
          absolute_timeout: 1209600
          idling_timeout: 0
          rolling_timeout: 0
        session_contents:
          access_token: true
          enc_id_token: true
          id_token: true
          user: true
        unauth_action: auth

  - name: cart
    priority: 20
    match:
      hosts:
      - "mitxonline.mit.test"
      - "api.mitxonline.mit.test"
      paths:
      - "/cart"
      - "/cart/"
      - "/cart/*"
    backends:
    - serviceName: mitxonline-webapp
      servicePort: 8010
    plugin_config_name: mitxonline-shared-plugins
    plugins:
    - name: openid-connect
      enable: true
      secretRef: ol-mitxonline-oidc     # pragma: allowlist secret
      config:
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_basic
        scope: "openid profile email organization:*"
        ssl_verify: false
        renew_access_token_on_expiry: true
        logout_path: "/logout/oidc"
        post_logout_redirect_uri: "https://mitxonline.mit.test/logout/"
        session:
          # Flat keys: APISIX 3.17+ ignores the nested session.cookie.* form.
          # 0 disables lua-resty-session's 900s idling / 3600s rolling
          # defaults, leaving absolute_timeout in charge, as deployed.
          cookie_domain: ".mitxonline.mit.test"
          absolute_timeout: 1209600
          idling_timeout: 0
          rolling_timeout: 0
        session_contents:
          access_token: true
          enc_id_token: true
          id_token: true
          user: true
        unauth_action: auth
---
# ─────────────────────────────────────────────────────────────────────────────
# Learn → mitxonline API proxy (mirrors production).
# In production this is
# mitxonline_apisix_route_prefix in
# src/ol_infrastructure/applications/mitxonline/__main__.py.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: mitxonline-learn-proxy-route
  namespace: mitxonline
spec:
  ingressClassName: apache-apisix
  http:
  - name: passauth
    priority: 0
    match:
      hosts:
      - api.learn.mit.test
      paths:
      - "/mitxonline/*"
    backends:
    - serviceName: mitxonline-webapp
      servicePort: 8010
    plugin_config_name: mitxonline-shared-plugins
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - "^/mitxonline/(.*)"
        - "/$1"
    - name: openid-connect
      enable: true
      # Same mitlearn client as the learn route (must match for session/token
      # refresh).
      secretRef: ol-mitlearn-oidc     # pragma: allowlist secret
      config:
        use_jwks: true
        bearer_only: false
        introspection_endpoint_auth_method: client_secret_post
        scope: "openid profile email ol-profile"
        ssl_verify: false
        renew_access_token_on_expiry: true
        # Reads the session cookie mit-learn's routes issue: same name, domain
        # and timeout as local-dev/apps/mit-learn/apisix-routes.yaml, same
        # session.secret through the ol-mitlearn-oidc Secret. lua-resty-session
        # checks a cookie's age against the reader's own absolute_timeout, so
        # a shorter value here would drop Learn sessions Learn still accepts.
        session:
          cookie_name: mitlearn_apisix_session_dev
          cookie_domain: ".learn.mit.test"
          absolute_timeout: 1209600
          # 0 disables lua-resty-session's 900s idling / 3600s rolling
          # defaults, leaving absolute_timeout in charge, as deployed.
          idling_timeout: 0
          rolling_timeout: 0
        unauth_action: pass
