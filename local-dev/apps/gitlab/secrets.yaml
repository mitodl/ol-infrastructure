---
# Local-dev credentials, tracked on purpose like the rest of local-dev's
# secrets: this instance is reachable only from the developer's own machine
# and holds nothing of value. Do not reuse these values anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-secrets
  namespace: gitlab
type: Opaque
stringData:
  # Sign in at https://gitlab.<root domain> as root with this password.
  root_password: localdevpassword  # pragma: allowlist secret
  # Pre-seeded personal access token, so an app that needs to talk to this
  # GitLab can be configured before anyone logs in. Seeded by the gitlab-token
  # Tilt resource (seed-token.sh).
  api_token: glpat-localdevlocaldev1234  # pragma: allowlist secret
