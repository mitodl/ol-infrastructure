---
# APISIX front door for the host's `tutor dev` instance.
#
# The backends are the openedx-tutor-proxy Service (see proxy.yaml), which
# forwards to host.k3d.internal:8000/8001 where tutor publishes the LMS and
# CMS. Routing Open edX through APISIX like every other app in the stack means
# it gets the same mkcert TLS, the same *.mit.dev naming, and — via the
# coredns-custom override installed by the core Pulumi stack — the same URL
# from inside a pod as from the browser. That is what lets mitxonline call
# https://lms.mit.dev directly.
apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: openedx-tutor-shared-plugins
  namespace: openedx
spec:
  plugins:
  - name: redirect
    enable: true
    config:
      http_to_https: true
  - name: prometheus
    enable: true
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: openedx-tutor-tls
  namespace: openedx
spec:
  ingressClassName: apache-apisix
  hosts:
  # Covered by the *.mit.dev SAN...
  - "lms.mit.dev"
  - "studio.mit.dev"
  # ...and these two by *.lms.mit.dev (both SANs generated by setup.sh).
  - "preview.lms.mit.dev"
  - "apps.lms.mit.dev"
  secret:
    name: local-dev-tls
    namespace: openedx
---
# No openid-connect plugin: Open edX owns its own login. Wiring it to the
# olapps realm is a separate piece of work — see "Open edX (tutor mode)" in
# local-dev/README.md.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: openedx-tutor-route
  namespace: openedx
spec:
  ingressClassName: apache-apisix
  http:
  - name: lms
    match:
      hosts:
      # PREVIEW_LMS_HOST serves the same LMS process; Studio's "preview"
      # links point at it and Open edX branches on the hostname internally.
      - "lms.mit.dev"
      - "preview.lms.mit.dev"
      paths:
      - "/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 8000
    plugin_config_name: openedx-tutor-shared-plugins

  - name: cms
    match:
      hosts:
      - "studio.mit.dev"
      paths:
      - "/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 8001
    plugin_config_name: openedx-tutor-shared-plugins
---
# Micro-frontends, one route per app because each one lives on its own tutor
# port in dev mode (the prebuilt `mfe` container publishes them, or a mounted
# repo's dev server takes the port over). Paths match tutor-mfe's own layout,
# so the URLs are the same shape it uses in production: with everything behind
# the ingress, https://apps.lms.mit.dev/<name> replaces http://host:<port>.
#
# The ol_local_dev tutor plugin rewrites Open edX's MFE settings to match.
# Enabling an MFE that tutor-mfe added after this file was written means adding
# its port here, to proxy.yaml, and to the plugin.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: openedx-tutor-mfe-route
  namespace: openedx
spec:
  ingressClassName: apache-apisix
  http:
  - name: mfe-authn
    match:
      hosts:
      - "apps.lms.mit.dev"
      paths:
      - "/authn"
      - "/authn/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 1999
    plugin_config_name: openedx-tutor-shared-plugins
  - name: mfe-authoring
    match:
      hosts:
      - "apps.lms.mit.dev"
      paths:
      - "/authoring"
      - "/authoring/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 2001
    plugin_config_name: openedx-tutor-shared-plugins
  - name: mfe-account
    match:
      hosts:
      - "apps.lms.mit.dev"
      paths:
      - "/account"
      - "/account/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 1997
    plugin_config_name: openedx-tutor-shared-plugins
  - name: mfe-communications
    match:
      hosts:
      - "apps.lms.mit.dev"
      paths:
      - "/communications"
      - "/communications/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 1984
    plugin_config_name: openedx-tutor-shared-plugins
  - name: mfe-discussions
    match:
      hosts:
      - "apps.lms.mit.dev"
      paths:
      - "/discussions"
      - "/discussions/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 2002
    plugin_config_name: openedx-tutor-shared-plugins
  - name: mfe-gradebook
    match:
      hosts:
      - "apps.lms.mit.dev"
      paths:
      - "/gradebook"
      - "/gradebook/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 1994
    plugin_config_name: openedx-tutor-shared-plugins
  - name: mfe-learner-dashboard
    match:
      hosts:
      - "apps.lms.mit.dev"
      paths:
      - "/learner-dashboard"
      - "/learner-dashboard/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 1996
    plugin_config_name: openedx-tutor-shared-plugins
  - name: mfe-learning
    match:
      hosts:
      - "apps.lms.mit.dev"
      paths:
      - "/learning"
      - "/learning/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 2000
    plugin_config_name: openedx-tutor-shared-plugins
  - name: mfe-ora-grading
    match:
      hosts:
      - "apps.lms.mit.dev"
      paths:
      - "/ora-grading"
      - "/ora-grading/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 1993
    plugin_config_name: openedx-tutor-shared-plugins
  - name: mfe-profile
    match:
      hosts:
      - "apps.lms.mit.dev"
      paths:
      - "/profile"
      - "/profile/*"
    backends:
    - serviceName: openedx-tutor-proxy
      servicePort: 1995
    plugin_config_name: openedx-tutor-shared-plugins
