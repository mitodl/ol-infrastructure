---
# Local values for ol-analytics-api's secret-backed variables. Deployed stacks
# read these variables from Vault, as described in
# src/ol_infrastructure/applications/ol_analytics_api/vault_secrets.py; the
# program writes the ones under `values:` into the ol-analytics-api-secrets
# Secret the pod reads through envFrom. Every described variable is named
# exactly once, under `values:` or `unset:`, and the program stops otherwise, so
# a variable added to the description needs a decision here. Two are neither:
# OL_ANALYTICS_API_B2B_DASHBOARD_MITXONLINE_CLIENT_{ID,SECRET} come from
# ANALYTICS_API_CLIENT_{ID,SECRET} in apps/mitxonline/pulumi/inputs.py, the pair
# mitxonline's pre-deploy Job registers. A key set under
# ol_analytics_api:env_vars in pulumi/Pulumi.Dev.yaml wins over this file
# (env: beats envFrom). mit.test is swapped for the cluster's root domain.
values:
  # The realm the learner-records tenant verifies partner tokens against.
  OL_ANALYTICS_API_B2B_LEARNER_RECORDS_ISSUER: "https://sso.ol.mit.test/realms/olapps"
# Not set locally, so the app's own default applies.
unset:
- SENTRY_DSN
# The default is the deployed client's id, ol-analytics-api-client, which
# local Keycloak does not have; the learner-records rule is not rendered here.
- OL_ANALYTICS_API_B2B_LEARNER_RECORDS_AUDIENCE
