---
# Placeholder secrets for ol-analytics-api. All values are local-only.
# The route's OIDC Secret (ol-mitlearn-oidc) is created by the Pulumi infra stack.
apiVersion: v1
kind: Secret
metadata:
  name: ol-analytics-api-secrets
  namespace: ol-analytics-api
type: Opaque
stringData:
  # The allin1 image's root user has no password. main.py reads it with
  # os.environ[...], so it has to be set, empty.
  STARROCKS_PASSWORD: ""
  # The pair mitxonline's pre-deploy Job registers (ANALYTICS_API_CLIENT_* in
  # apps/mitxonline/pulumi/inputs.py); tests/local_dev keeps the two equal.
  OL_ANALYTICS_API_B2B_DASHBOARD_MITXONLINE_CLIENT_ID: "ol-analytics-api-local"
  OL_ANALYTICS_API_B2B_DASHBOARD_MITXONLINE_CLIENT_SECRET: "local-dev-ol-analytics-api-mitxonline-secret"  # pragma: allowlist secret
