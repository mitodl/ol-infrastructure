---
# secretsprovider and encryptedkey will be populated on first `pulumi stack init`
# Root password must be set encrypted: pulumi config set --secret starrocks:root_password
secretsprovider: awskms://alias/infrastructure-secrets-production
config:
  starrocks:domain: lakehouse.starrocks.ol.mit.edu
  vault:address: https://vault-production.odl.mit.edu
  vault_server:env_namespace: operations.production
  starrocks:root_password:
    secure: v1:MXN6eaFDcXOtWfo8:JMrltk28ycvV6h6tG/8eiTOSkIBUBoxlshNtocbb0AJ7GCFgVdjkuf+XWUrKZOe+on8Vmip2e7Q= # set with: pulumi config set --secret starrocks:root_password
  starrocks:oidc_enabled: "true"
  starrocks:fe_config:
    replicas: 3
    # Observed 7-day peak FE CPU is ~150m. An 8000m request reserved ~50x that
    # and left FE unschedulable on the shared core nodegroup for 5 days
    # (incident 2026-08-05). Burst headroom is preserved via cpu_limit.
    cpu_request: 1000m
    cpu_limit: 8000m
    memory_request: 24Gi
    memory_limit: 24Gi
    # 75% of 24Gi container limit = 18Gi heap, leaving ~6Gi for JVM non-heap.
    # 16Gi / 12Gi heap was insufficient — live heap set reached 10Gi causing
    # constant G1GC mark cycles that stole CPU and timed out the 1s liveness
    # probe. Ref: https://docs.starrocks.io/docs/faq/fe_mem_faq/
    jvm_heap_mb: 18432
    # Raise optimizer timeout to tolerate slow AWS Glue metadata responses.
    # StarRocks default is 3000 ms.
    planner_optimize_timeout_ms: 30000
    storage: 100Gi
    log_storage: 100Gi
  starrocks:use_be: "false"
  starrocks:be_config:
    replicas: 3
    cpu_request: 16000m
    memory_request: 32Gi
    memory_limit: 32Gi
    storage: 1Ti
    log_storage: 100Gi
  starrocks:use_cn: "true"
  starrocks:cn_config:
    # One CN per node of the starrocks-cn Karpenter pool (16 vCPU / 128 GiB
    # with local NVMe, substructure/aws/eks starrocks:cn_nodepool). The
    # tracking-log scale spike (2026-11-10) could not build the largest
    # staging models on 16Gi CNs sharing spot nodes: memory, not CPU, was the
    # limit (no model passed 9 cores), and spill filled the shared root disk.
    dedicated_nodepool: true
    # 2 is the floor for interactive traffic and for losing a node. max is
    # the node pool's 6-node limit. The CPU HPA rarely fires at a 14-core
    # request, which is intended: adding CNs for the build window belongs to a
    # scheduled scale-up, not to CPU load.
    min_replicas: 2
    max_replicas: 6
    cpu_target_utilization_percentage: 80
    # Requests equal limits, so the pod is Guaranteed. Measured on
    # data-production 2026-11-25: a 4xlarge node has 15.89 allocatable cores,
    # an r7i.4xlarge 120.9 GiB allocatable memory, and the daemonsets on a CN
    # node request 0.47 cores and 1.0 GiB. 14 cores and 108Gi leave room for
    # daemonset growth.
    cpu_request: 14000m
    cpu_limit: 14000m
    memory_request: 108Gi
    memory_limit: 108Gi
    # Fractions of the NVMe filesystem (950 GB on r6id/r8id, 3.75 TB on
    # i4i). The scale spike spilled about 82 GiB per CN at 42% of the
    # mitxresidential tracking-log build.
    datacache_disk_size: 40%
    spill_max_dir_bytes_ratio: 0.4
  starrocks:enable_data_lake_integration: "true"
  starrocks:gravitino_catalog_enabled: "true"
  starrocks:ssl_enabled: "true"
  # ssl_force_secure_transport stays false until every client uses TLS. The
  # operator does (feSslMode REQUIRED in substructure/aws/eks), as do Vault,
  # Superset, Dagster and dbt. ol-analytics-api's aiomysql pool connects
  # without ssl and would be refused. Unchecked: OpenMetadata ingestion and the
  # mysql CLI the FE entrypoint uses to register followers and observers.
  starrocks:ssl_force_secure_transport: "false"
  starrocks:ssl_keystore_password:
    secure: v1:h7Hv+CSf6Hhk1mVg:Il+DfHH3nUPLk+SZFSQJwOfwt7h+Ses5dBlUYi3byc59bMaVNFVXsoaft1T9+g8cTLhPcGRazE8=
