# See Pulumi.CI.yaml for why `secretsprovider`/`encryptedkey` are omitted.
config:
  aws:region: us-east-1
  vault:address: https://vault-production.odl.mit.edu
  vault_server:env_namespace: operations.production
  # witan:oidc_audience: witan
  # Lifts the MCP pod's per-graph write gate from 4 to 24, paired with
  # omnigraph:per_actor_inflight_max in the omnigraph stack, which has the
  # sizing: a burst of writes waits instead of being refused, and a full queue
  # still finishes inside the 120s budget at Production's slowest observed
  # write cost. WITAN_REMOTE_WRITE_QUEUE_SECONDS stays at its 10s default.
  witan:remote_write_max_inflight: "24"
