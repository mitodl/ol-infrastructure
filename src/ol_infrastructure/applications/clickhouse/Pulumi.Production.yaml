---
# secretsprovider and encryptedkey will be set on first `pulumi stack init`
# Passwords must be added encrypted: `pulumi config set --secret clickhouse:admin_password`
config:
  consul:address: https://consul-data-production.odl.mit.edu
  clickhouse:hot_data_days: '7'
  clickhouse:hot_storage_size: 1500Gi
  clickhouse:replicas: '3'
  clickhouse:keeper_replicas: '3'
  # Guaranteed QoS: requests equal limits. Over the 7 days to 2026-09-24 the
  # server peaked at 3.14 GiB working set and 0.29 cores (5m rate), Keeper at
  # 0.27 GiB and 0.04 cores. The server's CPU is sized for parallelism, not
  # load: ClickHouse sets max_threads from the cgroup CPU limit (16 today, on
  # the 16-vCPU node), and Opik SELECTs peaked at a median of 6 threads (p99
  # 22) over the same week. 4 caps them at 4 threads rather than 2.
  clickhouse:server_resources:
    requests:
      cpu: '4'
      memory: 8Gi
    limits:
      cpu: '4'
      memory: 8Gi
  clickhouse:keeper_resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Mid-upgrade to 25.8 (CLICKHOUSE_SERVER_VERSION): keep writing parts 24.8
  # replicas can read until every replica runs 25.8.
  clickhouse:compatibility: '24.8'
  vault:address: https://vault-production.odl.mit.edu
  vault_server:env_namespace: operations.production
  clickhouse:admin_password:
    secure: v1:FJaeilA/IWurPzEC:fAvuOWlo1BE+HbCYfw1tQSlTlpZRtuvVZLh7KeGey/wuW1tuytuL3VjX9kkge6J641UPsyrkuog=
  clickhouse:tensorzero_password:
    secure: v1:Zobviz02IkPuv1S0:+2rm8Vf+ppbrAat0wo/2/7h/Sx8WS+RATn17MbgaZ8tabf8+8Ql4ROAY0t0x6oSK1A4PK49MhkE=
  clickhouse:opik_password:
    secure: v1:0YujLV7roc1zswg9:ox0Z4DETZ/LbiUgtBVe6rZv8uytuXkA33GnYRcwNauHglXKz3OaK7sZqsuqEpnMYZWppNBEwQrM=
  clickhouse:interserver_password:
    secure: v1:+DjkW8BtVkEq/axg:jiuaq5r7vTdvD+dGd/nalC8j0XQ33+BDBB+SJSyLsc0nb/Yq/wbom7f8VtHAefRISEZutCUdL8PfjkY=
  # Set to "true" only after the apply that adds interserver_password has
  # restarted every replica (see INTERSERVER_CREDENTIALS_XML in __main__.py).
  clickhouse:interserver_credentials_enabled: "false"
  # Set to "true" only after Keeper is verified serving TLS on 9281 in this
  # environment; flipping it restarts every replica (see keeper_tls_enabled
  # in __main__.py).
  clickhouse:keeper_tls_enabled: "false"
secretsprovider: awskms://alias/infrastructure-secrets-production
