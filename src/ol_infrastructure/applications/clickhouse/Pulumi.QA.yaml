  consul:address: https://consul-data-qa.odl.mit.edu
  clickhouse:hot_data_days: '3'
  # Measured 2026-09-15: the hot volume grew 4.17 -> 9.08 GiB over 11 weeks
  # (+1.95 GiB/month, the one non-prod volume with a real upward trend). Note
  # that hot_data_days does NOT bound this -- it is informational only, and no
  # deployed table carries a TTL ... TO VOLUME 'cold', so nothing ever tiers to
  # S3. The growth is untiered system-log accumulation (system holds 5.38 GiB of
  # the 6.0 GiB store; text_log, metric_log, asynchronous_metric_log and
  # processors_profile_log have no TTL), so it is steady rather than
  # workload-driven: 100Gi is ~11x current usage and ~3.9 years of headroom at
  # the observed rate. data-ci already runs 100Gi.
  clickhouse:hot_storage_size: 100Gi
