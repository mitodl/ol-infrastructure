---
telemetry:
  enabled: true

scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

compute_logs:
  module: dagster_aws.s3.compute_log_manager
  class: S3ComputeLogManager
  config:
    bucket:
      env: DAGSTER_BUCKET_NAME
    prefix: compute-logs/

# All three storages below use the pooled subclasses from ol-data-platform
# (ol_orchestrate.lib.postgres) rather than the stock dagster_postgres classes.
# The stock classes build every engine with poolclass=NullPool
# (dagster_postgres/event_log/event_log.py:102), so a process's connection count
# is a function of its query rate with no upper bound and no reuse: each
# operation is a fresh TCP connect and close.
#
# On 2026-08-18 that cost the daemon its ephemeral port space. It sustained 331
# outbound connects/second to the PgBouncer ClusterIP while holding only 13 of
# them open at a time; TIME_WAIT is a fixed 60s, so all 28232 ports in the pod's
# 32768-60999 range were consumed by a single destination tuple and connect()
# began returning EADDRNOTAVAIL -- surfacing as psycopg2 "Cannot assign
# requested address", which reads like PgBouncer is down but is raised by bind()
# before a packet is sent. PgBouncer was healthy throughout: 12 active clients,
# 11 active server connections, 0 waiting, against a 708-per-replica cap.
#
# QueuePool bounds each process at pool_size + max_overflow and, more to the
# point here, reuses the pool_size connections instead of reopening them.
#
# On the sizing: connections above pool_size are closed when returned rather
# than retained, so overflow churns exactly like NullPool does. pool_size must
# therefore cover a process's real concurrency or the churn this exists to stop
# simply continues at a lower rate.
#
# Which gives the house rule for splitting a given ceiling between the two:
# prefer a SMALL GUARANTEED pool_size and a LARGE BURST max_overflow. This
# mattered most under PgBouncer's pool_mode = session, where every retained
# QueuePool connection pinned a live RDS backend for the life of the process
# whether or not a query was running -- 30+60 and 60+30 both ceilinged at 90,
# but the second reserved twice as many real backends doing nothing,
# multiplied by every process sharing this file (16 on QA: 1 daemon, 2
# webservers, 13 code-location servers). pool_mode moved to transaction (see
# __main__.py) specifically because that multiplier turned into a measured
# 1.03:1 client:backend ratio; a retained QueuePool connection is now a
# PgBouncer client socket, not a pinned backend, while idle. The preference
# for a smaller pool_size still stands -- overflow connections still churn
# open/close the way NullPool always did -- it just no longer trades off
# against the shared RDS backend budget the way it did under session mode.
#
# The floor matters as much as the preference, and the two failure modes
# bracket you on both sides. Both were observed under the old session mode,
# so read "pool_size too high" as history rather than the live mechanism --
# see the correction below for what it means now:
#   pool_size too high -> under session mode, idle reserved connections ate
#     the shared database budget directly. QA, 2026-08-19: pinned at its full
#     764 aggregate cap, sv_idle 0, maxwait 543s against a 600s
#     query_wait_timeout. Under transaction mode a large pool_size no longer
#     costs backends while idle; it raises the ceiling on how many
#     transactions this one process can have in flight at once, which is a
#     concurrency-spike risk rather than a resting-cost one.
#   pool_size too low  -> steady-state work runs through the churning overflow
#     path, which is connect-per-use again: the NullPool behaviour described
#     above, 415 server assignments/s and every ephemeral port in TIME_WAIT.
#     This failure mode is unchanged by pool_mode -- overflow churns the same
#     way regardless of what PgBouncer does with the backend on the other end.
# So: pool_size = measured steady state, max_overflow = peaks. Not "make
# pool_size as small as possible". The original 10-per-storage sizing was
# based on a snapshot of 13-21 connections held across all three storages, but
# within an hour of shipping it the daemon was logging sustained
# "QueuePool limit of size 10 overflow 10 reached" timeouts -- 1000+ in 41
# minutes, 20-100/min continuously, not a burst. Tracebacks put the great
# majority of them in sql_event_log.py under automation_condition_evaluator,
# confirming the auto_run_reexecution amplifier called out below: evaluating
# automation conditions across many assets holds more concurrent event-log
# connections than a static snapshot caught. schedule_storage and run_storage
# did not show up in the tracebacks, so they get a smaller bump; event_log_storage
# gets sized for real headroom instead of another guess -- see its own comment
# below for the per-pod PgBouncer math behind that number.
#
# pool_size is a retention ceiling, not a preallocation: QueuePool opens
# connections lazily, so the 97 processes that share this ConfigMap (daemon, 2
# webservers, 14 code locations, up to max_concurrent_runs workers) only hold
# what they actually used. Run workers are not exempt from pool_size/
# max_overflow bounding their own concurrency just because they are
# short-lived -- but under transaction mode that no longer means a worker
# "counts against the per-pod [backend] cap for as long as it holds" a
# QueuePool connection open; it counts against the backend cap only while a
# transaction on that connection is actually in flight, and against the
# client-socket count (max_client_conn, sized with headroom to spare) the
# rest of the time. Run workers still tend to hold fewer concurrent
# transactions at once than the daemon.
#
# Under the old pool_mode = session, checking server_active/
# pgbouncer_pools_server_active_connections against this budget undercounted:
# a connection QueuePool returned to its own pool stayed connected to RDS as
# an idle-but-pinned backend rather than being released, so real load only
# showed up in pgbouncer_databases_current_connections (client connections) --
# the same metric DagsterPgBouncerConnectionHeadroom already alerts on
# (grafana_alerting/metric_rules/dagster_pgbouncer.py).
#
# Now that pool_mode is transaction (see __main__.py), that inversion is
# gone: an idle QueuePool connection costs PgBouncer a client socket, not a
# backend, so pgbouncer_pools_server_active_connections is back to meaning
# real concurrent work and is the more informative signal for this file's
# pool_size/max_overflow sizing. pgbouncer_databases_current_connections
# still bounds the per-pod cap and is what the headroom alert measures, so it
# remains the number that matters for max_db_connections -- check both, per
# pod and not summed across replicas, since a client's connections land on
# whichever pod kube-proxy routes them to and do not spread evenly by
# construction.
#
# event_log_storage's pool_size/max_overflow are stack config values, not
# literals, for the same reason max_concurrent_runs is: they have to be sized
# against each environment's own PgBouncer budget. See __main__.py and that
# storage's own comment below for the numbers and the per-pod math.
schedule_storage:
  module: ol_orchestrate.lib.postgres.schedule_storage
  class: PooledPostgresScheduleStorage
  config:
    pool_size: 15
    max_overflow: 15
    pool_recycle: 3600
    pool_timeout: 30
    postgres_db:
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port: 5432
      params:
        connect_timeout: 30

run_launcher:
  module: dagster_k8s
  class: K8sRunLauncher
  config:
    run_k8s_config:
      container_config:
        env:
        # Keep the OpenTelemetry auto-instrumentation agent off run workers.
        #
        # The user-deployments chart copies each code location's whole `env`
        # list into DAGSTER_CLI_API_GRPC_CONTAINER_CONTEXT, and K8sRunLauncher
        # applies that context to every run worker pod -- so the PYTHONPATH that
        # switches the agent on for the ten code servers (see dagster_otel_env
        # in __main__.py) would otherwise reach the run workers too. There is no
        # chart lever that grants a code location container env a run worker
        # does not inherit; `env_config_maps` and `env_secrets` propagate the
        # same way.
        #
        # Empty is the off switch, not a placeholder: CPython contributes no
        # sys.path entries for an empty PYTHONPATH, so site never finds the
        # agent's sitecustomize.py and the SDK is never initialised. This entry
        # is last in the container's env list (dagster_k8s/job.py builds it as
        # [*env, *job_config.env, *user_defined_env_vars], and run_k8s_config
        # supplies the third), and kubelet resolves duplicate names by last
        # assignment (kubelet_pods.go, makeEnvironmentVariables).
        #
        # Run workers stay excluded until their span volume has a sampling
        # decision: they live 7-9 seconds, so an 8s process depends entirely on
        # BatchSpanProcessor's at-exit flush, and a SIGKILL loses the spans.
        - name: PYTHONPATH
          value: ""
      pod_template_spec_metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      pod_spec_config:
        # Rank run workers below every priority-0 pod in the cluster. The
        # daemon is the highest-blast-radius pod in the namespace -- while it
        # is down nothing schedules, no sensors, no run monitoring, no run
        # timeouts -- yet at a shared priority of 0 it had the weakest claim
        # on capacity: incident 2026-08-10 left it Pending for 25 minutes
        # behind 178 run workers holding 90 CPU of requests, with the
        # scheduler reporting "No preemption victims found" because it could
        # not evict any of them.
        #
        # The chart pins at DAGSTER_CHART_VERSION renders no priorityClassName
        # for the daemon (grep the templates -- only schedulerName exists), so
        # raising the control plane is not expressible; lowering the batch
        # workload is. Preemption is safe here because run_monitoring's
        # max_resume_run_attempts and run_retries below already recover an
        # interrupted run, and karpenter.sh/do-not-disrupt above only stops
        # Karpenter consolidation, not kube-scheduler preemption.
        priority_class_name: dagster-run
      job_spec_config:
        # Overrides dagster_k8s' DEFAULT_K8S_JOB_TTL_SECONDS_AFTER_FINISHED of
        # 24h. Retained run pods are pure API objects, but every cluster-wide
        # informer caches them, so cluster memory footprint is (retention x
        # completion rate) -- not a function of live workload. At the rate
        # data-production sustains post-backlog-clear that ceiling was ~7-12k
        # pod objects, which OOMKilled the jupyterhub user-scheduler and the
        # vantage agent and left external-dns and all three VPA components
        # sized around the garbage.
        #
        # A finished run pod is only worth keeping for infrastructure-level
        # failures that produce no Dagster events (OOMKill, image pull error,
        # scheduling failure); run history and the event log are in Postgres
        # and compute logs are in S3, so an hour is enough to catch a page and
        # still `kubectl describe` the pod.
        ttl_seconds_after_finished: 3600
    load_incluster_config: true
    job_namespace: dagster
    image_pull_policy: IfNotPresent
    service_account_name: dagster
    dagster_home: "/opt/dagster/dagster_home"
    instance_config_map: "dagster-instance"
    postgres_password_secret: "dagster-postgresql-secret" # pragma: allowlist secret
    env_secrets:
    - dagster-static-secrets
    - dagster-dbt-secrets
    - dagster-postgresql-secret
      # Ops execute in run worker pods, not in the code location pods, so the
      # Sentry DSN has to reach them here as well.
    - dagster-sentry-secrets

# Pooled for the reasons documented on schedule_storage above.
run_storage:
  module: ol_orchestrate.lib.postgres.run_storage
  class: PooledPostgresRunStorage
  config:
    pool_size: 15
    max_overflow: 15
    pool_recycle: 3600
    pool_timeout: 30
    postgres_db:
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port: 5432
      params:
        connect_timeout: 30

# Opt in to run monitoring
run_monitoring:
  enabled: true
  start_timeout_seconds: 900
  cancel_timeout_seconds: 300
  max_resume_run_attempts: 3
  poll_interval_seconds: 120
  max_runtime_seconds: 0

run_retries:
  enabled: true
  max_retries: 3

# Pooled for the reasons documented on schedule_storage above. This is the
# hottest of the three: store_event runs per event, and each asset check event
# additionally reaches supports_asset_checks, an uncached @property on
# SqlEventLogStorage whose has_table implementation opens a connection it never
# closes (dagster_postgres/event_log/event_log.py:363) -- one extra connect per
# call under NullPool. The auto_run_reexecution path emits one planned event per
# asset, so retrying a large dbt job is a burst of exactly these.
#
# Confirmed, not just predicted: switching this to QueuePool on 2026-08-18
# immediately produced sustained "QueuePool limit of size 10 overflow 10
# reached" timeouts -- 1000+ in 41 minutes, continuous, not a burst -- traced
# to automation_condition_evaluator driving concurrent event-log queries
# during automation-tick evaluation. 10+10 measured the daemon's connections
# at rest, not what a tick evaluating many assets at once actually needs, so
# this gets real headroom rather than another guess at a tight number.
#
# pool_size/max_overflow are placeholder tokens substituted in __main__.py
# from dagster:event_log_pool_size / dagster:event_log_max_overflow stack
# config, the same mechanism as run_coordinator's MAX_CONCURRENT_RUNS below --
# not a literal, because the right ceiling depends on the environment's own
# PgBouncer budget. Production sets 50+100, a 150-connection ceiling for this
# storage alone; QA sets 30+60 for a 90-connection one, weighted toward
# overflow rather than pool_size because overflow churns while pool_size is
# retained, and QA cannot afford the resting footprint (see Pulumi.QA.yaml);
# the fallback in
# __main__.py is the original 10+10 for any stack that has set neither.
#
# QA's own number is the cautionary tale for how these get chosen. It was left
# on the fallback when Production was sized, on the stated grounds that it had
# not shown this failure -- and it had, continuously, at 100-250 timeout lines
# per 10 minutes, unnoticed for as long as nothing was watching for them.
# Assume a stack on the fallback is unsized rather than measured-and-fine, and
# check DagsterDatabaseConnectionFailures before concluding otherwise.
#
# What was right about that decision is that QA did not simply inherit
# Production's number: QA's per-pod cap is 382 against Production's 708, and
# QA has already deadlocked its whole pool once from run-worker connections
# alone (see the 2026-08-17 incident notes in __main__.py), so it cannot absorb
# a 150-connection ceiling on top of that. Its 90 is derived against its own
# cap by the same arithmetic used for Production below.
#
# Production's number, checked against __main__.py's per-pod PgBouncer math
# (not just the aggregate budget, for the reason in the top-of-file comment):
# worst case, every process that shares this ConfigMap and touches event log
# storage heavily -- the daemon plus the 2 webserver replicas -- pegs this
# ceiling on the same pod at once. That is 3 x (event log 150 + run storage 30
# + schedule storage 30) = 630 against a 708 cap: tighter than it looks, but
# still clear.
#
# What that 630 does not bound: run workers mount this same ConfigMap and
# inherit the same ceilings, and up to max_concurrent_runs (80 in production)
# of them can be live at once. They are not exempt from the per-pod cap just
# because they are short-lived, and their real aggregate footprint here is
# unmeasured -- the closest data point is QA's ~22 connections/worker from
# the deadlock above, which was itself an abnormal-state measurement, not a
# steady-state one. Production's replica-to-replica spread has been even so
# far (1-18 active per pod, per __main__.py), unlike QA's observed 221-vs-4
# skew, which is the only reason 630 has not already been tested against
# worker load. Check pgbouncer_databases_current_connections per pod, not
# summed, after this ships -- this analysis does not prove the worker
# contribution is safe, only that it has not yet been observed to be unsafe.
event_log_storage:
  module: ol_orchestrate.lib.postgres.event_log
  class: PooledPostgresEventLogStorage
  config:
    pool_size: EVENT_LOG_POOL_SIZE
    max_overflow: EVENT_LOG_MAX_OVERFLOW
    pool_recycle: 3600
    pool_timeout: 30
    postgres_db:
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port: 5432
      params:
        connect_timeout: 30

# The max_concurrent_runs value below is a placeholder token, substituted in
# __main__.py from the dagster:max_concurrent_runs stack config -- see the
# rationale there. It is a placeholder rather than a literal because run
# concurrency has to be sized against the environment's PgBouncer connection
# budget, and QA's is 5.5x smaller than production's.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: MAX_CONCURRENT_RUNS

# Configures how long Dagster waits for code locations
# to load before timing out.
code_servers:
  local_startup_timeout: 360
  reload_timeout: 360
