---
telemetry:
  enabled: true

scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

compute_logs:
  module: dagster_aws.s3.compute_log_manager
  class: S3ComputeLogManager
  config:
    bucket:
      env: DAGSTER_BUCKET_NAME
    prefix: compute-logs/

# All three storages below use the pooled subclasses from ol-data-platform
# (ol_orchestrate.lib.postgres) rather than the stock dagster_postgres classes.
# The stock classes build every engine with poolclass=NullPool
# (dagster_postgres/event_log/event_log.py:102), so a process's connection count
# is a function of its query rate with no upper bound and no reuse: each
# operation is a fresh TCP connect and close.
#
# On 2026-08-18 that cost the daemon its ephemeral port space. It sustained 331
# outbound connects/second to the PgBouncer ClusterIP while holding only 13 of
# them open at a time; TIME_WAIT is a fixed 60s, so all 28232 ports in the pod's
# 32768-60999 range were consumed by a single destination tuple and connect()
# began returning EADDRNOTAVAIL -- surfacing as psycopg2 "Cannot assign
# requested address", which reads like PgBouncer is down but is raised by bind()
# before a packet is sent. PgBouncer was healthy throughout: 12 active clients,
# 11 active server connections, 0 waiting, against a 708-per-replica cap.
#
# QueuePool bounds each process at pool_size + max_overflow and, more to the
# point here, reuses the pool_size connections instead of reopening them.
#
# On the sizing: connections above pool_size are closed when returned rather
# than retained, so overflow churns exactly like NullPool does. pool_size must
# therefore cover a process's real concurrency or the churn this exists to stop
# simply continues at a lower rate. The original 10-per-storage sizing was
# based on a snapshot of 13-21 connections held across all three storages, but
# within an hour of shipping it the daemon was logging sustained
# "QueuePool limit of size 10 overflow 10 reached" timeouts -- 1000+ in 41
# minutes, 20-100/min continuously, not a burst. Tracebacks put the great
# majority of them in sql_event_log.py under automation_condition_evaluator,
# confirming the auto_run_reexecution amplifier called out below: evaluating
# automation conditions across many assets holds more concurrent event-log
# connections than a static snapshot caught. schedule_storage and run_storage
# did not show up in the tracebacks, so they get a smaller bump; event_log_storage
# gets sized for real headroom instead of another guess -- see its own comment
# below for the per-pod PgBouncer math behind that number.
#
# pool_size is a retention ceiling, not a preallocation: QueuePool opens
# connections lazily, so the 97 processes that share this ConfigMap (daemon, 2
# webservers, 14 code locations, up to max_concurrent_runs workers) only hold
# what they actually used. Run workers hold none when idle and live 7-9
# seconds, which is why the worst-case product of 97 x 3 x pool ceiling
# overstates the real total by more than an order of magnitude -- measured
# peak across the whole fleet was 122 active server connections before this
# change, rising to ~184 as the event log pool started saturating, against an
# aggregate budget of 4248. Check pgbouncer_pools_server_active_connections
# again after this ships rather than trusting the estimate.
schedule_storage:
  module: ol_orchestrate.lib.postgres.schedule_storage
  class: PooledPostgresScheduleStorage
  config:
    pool_size: 15
    max_overflow: 15
    pool_recycle: 3600
    pool_timeout: 30
    postgres_db:
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port: 5432
      params:
        connect_timeout: 30

run_launcher:
  module: dagster_k8s
  class: K8sRunLauncher
  config:
    run_k8s_config:
      pod_template_spec_metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      pod_spec_config:
        # Rank run workers below every priority-0 pod in the cluster. The
        # daemon is the highest-blast-radius pod in the namespace -- while it
        # is down nothing schedules, no sensors, no run monitoring, no run
        # timeouts -- yet at a shared priority of 0 it had the weakest claim
        # on capacity: incident 2026-08-10 left it Pending for 25 minutes
        # behind 178 run workers holding 90 CPU of requests, with the
        # scheduler reporting "No preemption victims found" because it could
        # not evict any of them.
        #
        # The chart pins at DAGSTER_CHART_VERSION renders no priorityClassName
        # for the daemon (grep the templates -- only schedulerName exists), so
        # raising the control plane is not expressible; lowering the batch
        # workload is. Preemption is safe here because run_monitoring's
        # max_resume_run_attempts and run_retries below already recover an
        # interrupted run, and karpenter.sh/do-not-disrupt above only stops
        # Karpenter consolidation, not kube-scheduler preemption.
        priority_class_name: dagster-run
      job_spec_config:
        # Overrides dagster_k8s' DEFAULT_K8S_JOB_TTL_SECONDS_AFTER_FINISHED of
        # 24h. Retained run pods are pure API objects, but every cluster-wide
        # informer caches them, so cluster memory footprint is (retention x
        # completion rate) -- not a function of live workload. At the rate
        # data-production sustains post-backlog-clear that ceiling was ~7-12k
        # pod objects, which OOMKilled the jupyterhub user-scheduler and the
        # vantage agent and left external-dns and all three VPA components
        # sized around the garbage.
        #
        # A finished run pod is only worth keeping for infrastructure-level
        # failures that produce no Dagster events (OOMKill, image pull error,
        # scheduling failure); run history and the event log are in Postgres
        # and compute logs are in S3, so an hour is enough to catch a page and
        # still `kubectl describe` the pod.
        ttl_seconds_after_finished: 3600
    load_incluster_config: true
    job_namespace: dagster
    image_pull_policy: IfNotPresent
    service_account_name: dagster
    dagster_home: "/opt/dagster/dagster_home"
    instance_config_map: "dagster-instance"
    postgres_password_secret: "dagster-postgresql-secret" # pragma: allowlist secret
    env_secrets:
    - dagster-static-secrets
    - dagster-dbt-secrets
    - dagster-postgresql-secret
      # Ops execute in run worker pods, not in the code location pods, so the
      # Sentry DSN has to reach them here as well.
    - dagster-sentry-secrets

# Pooled for the reasons documented on schedule_storage above.
run_storage:
  module: ol_orchestrate.lib.postgres.run_storage
  class: PooledPostgresRunStorage
  config:
    pool_size: 15
    max_overflow: 15
    pool_recycle: 3600
    pool_timeout: 30
    postgres_db:
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port: 5432
      params:
        connect_timeout: 30

# Opt in to run monitoring
run_monitoring:
  enabled: true
  start_timeout_seconds: 900
  cancel_timeout_seconds: 300
  max_resume_run_attempts: 3
  poll_interval_seconds: 120
  max_runtime_seconds: 0

run_retries:
  enabled: true
  max_retries: 3

# Pooled for the reasons documented on schedule_storage above. This is the
# hottest of the three: store_event runs per event, and each asset check event
# additionally reaches supports_asset_checks, an uncached @property on
# SqlEventLogStorage whose has_table implementation opens a connection it never
# closes (dagster_postgres/event_log/event_log.py:363) -- one extra connect per
# call under NullPool. The auto_run_reexecution path emits one planned event per
# asset, so retrying a large dbt job is a burst of exactly these.
#
# Confirmed, not just predicted: switching this to QueuePool on 2026-08-18
# immediately produced sustained "QueuePool limit of size 10 overflow 10
# reached" timeouts -- 1000+ in 41 minutes, continuous, not a burst -- traced
# to automation_condition_evaluator driving concurrent event-log queries
# during automation-tick evaluation. 10+10 measured the daemon's connections
# at rest, not what a tick evaluating many assets at once actually needs, so
# this gets real headroom rather than another guess at a tight number.
#
# 100+50 gives the daemon a 150-connection ceiling for this storage alone.
# Checked against __main__.py's pgbouncer sizing, not just the aggregate
# budget: max_db_connections there is derived as budget / replica count
# because a client's connections land on whichever of the 6 pgbouncer pods
# kube-proxy routes them to, not spread evenly by construction, so the
# binding constraint is the per-pod cap (708 currently) and not the aggregate
# (4248). Worst case every process sharing this ConfigMap that touches event
# log storage heavily -- the daemon plus the 2 webserver replicas -- pegs its
# ceiling on the same pod at once: 3 x 150 = 450, still comfortably under 708.
# Run workers are excluded from that sum because they hold connections for
# 7-9 seconds, not the process lifetime. Recheck
# pgbouncer_pools_server_active_connections (per-pod, not just summed) after
# this ships.
event_log_storage:
  module: ol_orchestrate.lib.postgres.event_log
  class: PooledPostgresEventLogStorage
  config:
    pool_size: 100
    max_overflow: 50
    pool_recycle: 3600
    pool_timeout: 30
    postgres_db:
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port: 5432
      params:
        connect_timeout: 30

# The max_concurrent_runs value below is a placeholder token, substituted in
# __main__.py from the dagster:max_concurrent_runs stack config -- see the
# rationale there. It is a placeholder rather than a literal because run
# concurrency has to be sized against the environment's PgBouncer connection
# budget, and QA's is 5.5x smaller than production's.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: MAX_CONCURRENT_RUNS

# Configures how long Dagster waits for code locations
# to load before timing out.
code_servers:
  local_startup_timeout: 360
  reload_timeout: 360
