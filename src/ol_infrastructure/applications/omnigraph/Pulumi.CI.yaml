---
# `secretsprovider`/`encryptedkey` are intentionally omitted here — this
# stack has no `secure:` config values (all real secrets are Vault-synced
# K8s Secrets, provisioned in __main__.py, not Pulumi stack config). The
# first `pulumi stack init --secrets-provider=awskms://alias/infrastructure-secrets-ci`
# run against this stack will populate both, matching every other stack under
# this KMS alias.
config:
  omnigraph:managed_repos:
    # Repos with a per-repo `code-<repo>` graph on this cluster. Canonical repo
    # URIs, matched byte-for-byte against what witan-code detects from a
    # checkout's git remote. A `pulumi up` is all adding one needs: the
    # pre-deploy `omnigraph cluster apply` Job creates the graph and the server
    # restarts into it (data_tier.py; graph ids from cluster_config.py
    # build_cluster_graphs). The CI indexer reads this list from the stack
    # output, so it starts indexing a new repo on the next witan deploy.
    #
    # Seeded from the mitodl repos with the most human-authored commits in the
    # 90 days to 2026-07-31 (bot commits excluded), cut at >=35. Re-derive
    # rather than assuming this stays current; a repo nobody works in is a
    # graph nobody queries.
  - https://github.com/mitodl/ol-infrastructure
  - https://github.com/mitodl/mit-learn
  - https://github.com/mitodl/mitxonline
  - https://github.com/mitodl/ol-data-platform
  - https://github.com/mitodl/agent-kit
  - https://github.com/mitodl/lehrer
  - https://github.com/mitodl/ocw-studio
  - https://github.com/mitodl/odl-video-service
  - https://github.com/mitodl/mitxpro
  - https://github.com/mitodl/ol-concourse
  - https://github.com/mitodl/open-edx-plugins
  - https://github.com/mitodl/learn-ai
  - https://github.com/mitodl/ocw-hugo-themes
  - https://github.com/mitodl/ol-django
    # Added 2026-09-18 by the same cut, re-derived over the 90 days to
    # 2026-09-18, for repos agents were already querying and getting
    # ClusterGraphMissing on: ol-analytics-api (39), platform-engineering-site (36).
  - https://github.com/mitodl/ol-analytics-api
  - https://github.com/mitodl/platform-engineering-site
    # Added 2026-11-12 by the same cut (146 human commits in the 90 days to
    # 2026-11-12); Production logged ~420 ClusterGraphMissing calls for it
    # 2026-11-05..10 from witan-code's edit hook.
  - https://github.com/mitodl/ol-llm
    # Added 2026-11-12 for cross-repo bridge coverage rather than commit
    # volume: each one gives an existing binding its missing other side.
    # micromasters and ocw-hugo-projects are services this repo already
    # deploys; smoot-design and course-search-utils are npm packages the
    # indexed frontends import; open-learning-ai-tutor, mitx-grading-library
    # and django-aqueduct are Python packages indexed apps depend on; the
    # Keycloak repos sit behind ol-django's mitol.keycloak and mitol.scim.
    # edx-platform is deliberately not here yet: at about 2.3 GB, its cold
    # first parse risks the indexer's serial 3h deadline for the whole sweep.
  - https://github.com/mitodl/micromasters
  - https://github.com/mitodl/ocw-hugo-projects
  - https://github.com/mitodl/smoot-design
  - https://github.com/mitodl/course-search-utils
  - https://github.com/mitodl/open-learning-ai-tutor
  - https://github.com/mitodl/mitx-grading-library
  - https://github.com/mitodl/django-aqueduct
  - https://github.com/mitodl/ol-keycloak
  - https://github.com/mitodl/ol-keycloakify
  - https://github.com/mitodl/keycloak-scim
  # Setting this is what turns actor-token sync on: the bootstrap Job and the
  # hourly CronJob take ownership of secret-operations/witan/actor-tokens,
  # which Pulumi otherwise writes directly. Safe to set only because the
  # existing actor-tokens resource already carries retainOnDelete=true (from
  # #5253) — without that, dropping it from the program deletes the Vault path
  # and leaves a window where no token is valid for anybody.
  #
  # REQUIRES ol-substructure-keycloak to have been deployed to this
  # environment first: it creates the witan-token-sync client and populates
  # secret-operations/witan/token-sync-oidc, without which the bootstrap Job
  # has no credential to authenticate to Keycloak with.
  omnigraph:keycloak_url: https://sso-ci.ol.mit.edu
  aws:region: us-east-1
  vault:address: https://vault-ci.odl.mit.edu
  vault_server:env_namespace: operations.ci
  # The storage-format generation this cluster serves. CI was migrated from
  # format 9 to format 14 (omnigraph 0.13.0) on 2026-10-14; the rebuilt graphs
  # live under `<bucket>/fmt14` and the format-9 graphs remain at
  # `<bucket>/fmt9` as the rollback.
  #
  # This MUST be committed, not just `pulumi config set` locally. A cutover
  # that exists only in a working copy is reverted by the next pipeline
  # deploy, which repoints the cluster at the old root while the server image
  # can only read the new format — every graph then fails to open and the
  # server crashloops. That is exactly what happened here for ~12h.
  omnigraph:storage_prefix: fmt14
  # Cross-checked against storage_prefix at preview time
  # (validate_internal_schema_version, storage.py) — the two must agree, and
  # __main__.py fails the preview loudly if either is missing or they
  # disagree. Not derived from storage_prefix's own fmt<N> name: this is a
  # second, independently-set value precisely so a slip in one without the
  # other is caught here instead of reaching the cluster as a crash-looping
  # server, same incident this comment already describes above.
  omnigraph:internal_schema_version: 14
  # The nightly cleanup keeps each branch's head commit (`--keep 1`) instead of
  # 2 days of commits, so its plan reads the head instead of every older
  # commit manifest. CI goes first; QA and Production stay on the age until a
  # QA cleanup is measured. Removing it refuses cleanup's sweep for about 2
  # nights, and raising it can refuse indefinitely on a quiet branch. Read
  # maintenance.py below DEFAULT_CLEANUP_OLDER_THAN before changing it.
  omnigraph:cleanup_keep: 1
secretsprovider: awskms://alias/infrastructure-secrets-ci
