---
# See Pulumi.CI.yaml for why `secretsprovider`/`encryptedkey` are omitted.
config:
  omnigraph:managed_repos:
    # Repos with a per-repo `code-<repo>` graph on this cluster. Canonical repo
    # URIs, matched byte-for-byte against what witan-code detects from a
    # checkout's git remote. Adding one here needs a `pulumi up` plus an
    # `omnigraph cluster apply` and a server restart before clients can reach
    # it — see applications/omnigraph/data_tier.py build_cluster_graphs.
    #
    # Seeded from the mitodl repos with the most human-authored commits in the
    # 90 days to 2026-07-31 (bot commits excluded), cut at >=35. Re-derive
    # rather than assuming this stays current; a repo nobody works in is a
    # graph nobody queries.
  - https://github.com/mitodl/ol-infrastructure
  - https://github.com/mitodl/mit-learn
  - https://github.com/mitodl/mitxonline
  - https://github.com/mitodl/ol-data-platform
  - https://github.com/mitodl/agent-kit
  - https://github.com/mitodl/lehrer
  - https://github.com/mitodl/ocw-studio
  - https://github.com/mitodl/odl-video-service
  - https://github.com/mitodl/mitxpro
  - https://github.com/mitodl/ol-concourse
  - https://github.com/mitodl/open-edx-plugins
  - https://github.com/mitodl/learn-ai
  - https://github.com/mitodl/ocw-hugo-themes
  - https://github.com/mitodl/ol-django
  # Turns actor-token sync on: the bootstrap Job and the hourly CronJob take
  # ownership of secret-operations/witan/actor-tokens, which Pulumi otherwise
  # writes directly. Safe only because the existing actor-tokens resource
  # already carries retainOnDelete=true (from #5253) — without that, dropping
  # it from the program deletes the Vault path and leaves a window where no
  # token is valid for anybody.
  #
  # REQUIRES ol-substructure-keycloak to have been deployed to this
  # environment first: it creates the witan-token-sync client and populates
  # secret-operations/witan/token-sync-oidc, without which the bootstrap Job
  # has no credential to authenticate to Keycloak with.
  omnigraph:keycloak_url: https://sso-qa.ol.mit.edu
  aws:region: us-east-1
  vault:address: https://vault-qa.odl.mit.edu
  vault_server:env_namespace: operations.qa
  omnigraph:storage_prefix: fmt6
  # Cross-checked against storage_prefix at preview time — see the CI
  # config's comment on this same key for why.
  omnigraph:internal_schema_version: 6
  # ★★ THE EXPERIMENT THIS WAS RAISED FOR IS OVER, IT FAILED, AND THE VALUE
  # STAYS ANYWAY. Read this before "fixing" it.
  #
  # RESULT: with this cap at 50 AND witan's client-side gate also at 50, a
  # 16-writer probe against QA returned 0 acked / 16 errored with 8
  # INDETERMINATE (errored but committed), and every read timed out. The witan
  # pod log recorded 13 `outcome: ok` for the same 16 writes — thirteen writes
  # landed and not one caller learned it. Progression:
  #     gate 4  / actor 4    6 acked, 0 INDETERMINATE  (clean refusals)
  #     gate 50 / actor 4    9 acked, 0 INDETERMINATE  (clean 429s)
  #     gate 50 / actor 50   0 acked, 8 INDETERMINATE  (collapse)
  #
  # ★ THE MEMORY PREDICTION HELD; THE TIME ONE DID NOT SAVE US. No OOMKill, 0
  # restarts, pod Ready throughout — per_actor_bytes_max at 256 MiB did its job
  # exactly as argued below. The failure was purely TIME: writes are still
  # serialised per graph, the queue ran past the 120s budget, and callers
  # collected errors for work that had already committed. So #531's parallel
  # staging did NOT change the per-graph serialisation, and data_tier.py's knee
  # is real even though its 30s premise went stale.
  #
  # ★ MAINTAINER DECISION 2026-08-31: KEEP 50 ON QA REGARDLESS. QA sees no real
  # use, so the exposure has no victim, and leaving it lifted keeps QA
  # unblocked for future sizing work without another two deploy cycles. This is
  # deliberate, not an un-reverted experiment.
  #
  # ★ NEVER COPY THIS TO CI OR PRODUCTION. Neither sets this key, so both stay
  # on data_tier.py's DEFAULT_PER_ACTOR_INFLIGHT_MAX of 4, and the collapse
  # above is what raising it there would buy.
  #
  # DO NOT chase more throughput by raising caps further — that lever is spent.
  # The next honest one is reducing per-write cost: a single-row insert costs a
  # full-table FilteredRead upstream, and batching the hot witan write paths.
  #
  # The original rationale for trying 50 follows, kept because the reasoning
  # about WHY each cap had to move is still correct; only its hoped-for outcome
  # was wrong.
  #
  # WHY, IN SEQUENCE. omnigraph #531 (in the `edge` build agent-kit#305 pinned)
  # stages independent tables at the loader's write concurrency instead of a
  # pinned 1, so the engine should absorb more concurrent writes. Two caps have
  # each stopped that being measurable, and each was found by reading the
  # refusal text rather than by guessing:
  #   1. witan's client-side `_WriteGate`, 4. Raised to 50 for QA in #5671:
  #      throughput went 6 -> 9 acked, then flattened at 9 for BOTH 16 and 24
  #      writers.
  #   2. this cap. With 50 slots client-side, every remaining refusal read
  #      "actor in-flight count cap 4 exceeded (HTTP 429)" — 44 such lines in
  #      the witan pod log across two runs, and ZERO from witan's own gate.
  # The engine has still never been reached. This removes the second cap for
  # the same reason the first went: at the cap it stays a candidate explanation
  # for whatever is observed.
  #
  # ★ THE SIZING RATIONALE IN data_tier.py IS STALE, WHICH IS WHY THIS MOVES AT
  # ALL. That comment derives 4 from a 30s deadline — measured 2026-08-12: n=4
  # wall 15.54s, n=6 31.20s, n=8 51.08s/p50 33.29s, hence "at 4 every admitted
  # write lands inside the deadline; at 8 the median is past it". The 30s came
  # from three hardcoded ToolHive constants. ToolHive is GONE (#5448) and the
  # budget is now 120s (WITAN_REMOTE_CALL_BUDGET_SECONDS), against which even
  # the n=8 measurement fits with room to spare.
  #
  # ★ MEMORY IS NOT THE RISK, AND THIS IS THE LOAD-BEARING SAFETY POINT.
  # In-flight MEMORY is bounded by per_actor_bytes_max, deliberately left at
  # its default (256 MiB, sized against the pod's 2Gi limit). That is a
  # separate and still-enforced per-actor bound, so raising the COUNT does not
  # raise how many bytes an actor may have in flight: one actor is capped at
  # 256 MiB whether its count limit is 4 or 50. The count was never the memory
  # bound — data_tier.py says so itself.
  #
  # THE REAL RISK IS TIME, and it is the experiment. Writes are serialised per
  # graph and the 2026-08-12 numbers show per-write cost RISING with writers
  # (0.31 -> 0.16 req/s). If #531 did not change that, admitting 50 queues work
  # past even the 120s budget and the caller gets a 502 of indeterminate
  # outcome instead of a clean 429. Provoking that on QA is the point — the
  # probe counts it in its INDETERMINATE bucket, which has been 0 in every run
  # so far. On Production it would be a regression.
  #
  # Unquoted because `__main__.py` reads it with `get_int` and `_bounded_cap`
  # refuses anything outside 0..u32 — out of range, omnigraph silently reverts
  # to its OWN upstream defaults (16 in flight, 4 GiB), which are looser than
  # ours in both directions. 50 is above upstream's 16, deliberately, and well
  # inside the accepted range.
  omnigraph:per_actor_inflight_max: 50
secretsprovider: awskms://alias/infrastructure-secrets-qa
