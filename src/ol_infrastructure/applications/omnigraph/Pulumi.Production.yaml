---
# See Pulumi.CI.yaml for why `secretsprovider`/`encryptedkey` are omitted.
config:
  omnigraph:managed_repos:
    # Repos with a per-repo `code-<repo>` graph on this cluster. Canonical repo
    # URIs, matched byte-for-byte against what witan-code detects from a
    # checkout's git remote. A `pulumi up` is all adding one needs: the
    # pre-deploy `omnigraph cluster apply` Job creates the graph and the server
    # restarts into it (data_tier.py; graph ids from cluster_config.py
    # build_cluster_graphs). The CI indexer reads this list from the stack
    # output, so it starts indexing a new repo on the next witan deploy.
    #
    # Seeded from the mitodl repos with the most human-authored commits in the
    # 90 days to 2026-07-31 (bot commits excluded), cut at >=35. Re-derive
    # rather than assuming this stays current; a repo nobody works in is a
    # graph nobody queries.
  - https://github.com/mitodl/ol-infrastructure
  - https://github.com/mitodl/mit-learn
  - https://github.com/mitodl/mitxonline
  - https://github.com/mitodl/ol-data-platform
  - https://github.com/mitodl/agent-kit
  - https://github.com/mitodl/lehrer
  - https://github.com/mitodl/ocw-studio
  - https://github.com/mitodl/odl-video-service
  - https://github.com/mitodl/mitxpro
  - https://github.com/mitodl/ol-concourse
  - https://github.com/mitodl/open-edx-plugins
  - https://github.com/mitodl/learn-ai
  - https://github.com/mitodl/ocw-hugo-themes
  - https://github.com/mitodl/ol-django
    # Added 2026-09-18 by the same cut, re-derived over the 90 days to
    # 2026-09-18, for repos agents were already querying and getting
    # ClusterGraphMissing on: ol-analytics-api (39), platform-engineering-site (36).
  - https://github.com/mitodl/ol-analytics-api
  - https://github.com/mitodl/platform-engineering-site
  # Turns actor-token sync on: the bootstrap Job and the hourly CronJob take
  # ownership of secret-operations/witan/actor-tokens, which Pulumi otherwise
  # writes directly. Safe only because the existing actor-tokens resource
  # already carries retainOnDelete=true (from #5253) — without that, dropping
  # it from the program deletes the Vault path and leaves a window where no
  # token is valid for anybody.
  #
  # REQUIRES ol-substructure-keycloak to have been deployed to this
  # environment first: it creates the witan-token-sync client and populates
  # secret-operations/witan/token-sync-oidc, without which the bootstrap Job
  # has no credential to authenticate to Keycloak with.
  #
  # Production's realm is sso.ol.mit.edu — NOT sso-production. The runbook's
  # `https://sso-<env>.ol.mit.edu` template holds for CI and QA but not here.
  omnigraph:keycloak_url: https://sso.ol.mit.edu
  aws:region: us-east-1
  vault:address: https://vault-production.odl.mit.edu
  vault_server:env_namespace: operations.production
  omnigraph:storage_prefix: fmt14
  # Cross-checked against storage_prefix at preview time — see the CI
  # config's comment on this same key for why.
  omnigraph:internal_schema_version: 14
  # Raised from the default of 4, with witan:remote_write_max_inflight in the
  # witan stack, so a burst of writes waits instead of being refused with HTTP
  # 429. Measured on QA under omnigraph 0.13 on 2026-10-21: the caps do not
  # change throughput (writes to one graph commit one at a time), only where a
  # burst queues.
  #
  # 24, not QA's 50, because every admitted write has to finish inside witan's
  # 120s budget or it times out with an indeterminate outcome, which is worse
  # than a 429. Production's memory_store took about 2.7s typical and 4.8s at
  # worst over the 7 days to 2026-10-21 (Loki mcp.tool_call duration_ms), and
  # 120s / 4.8s is 25. witan's deadline check does not cover this within a
  # burst: it predicts from the graph's average write time, which only moves
  # as writes finish, so a burst is admitted on a quiet graph's average.
  # Re-derive from the per-write cost if it changes (e.g. once the hot write
  # paths are batched). In-flight memory stays bounded by per_actor_bytes_max.
  # Unquoted because __main__.py reads it with get_int.
  omnigraph:per_actor_inflight_max: 24
secretsprovider: awskms://alias/infrastructure-secrets-production
