---
# Shared repository shapes for the mitodl fleet.
#
# A repo's YAML in data/repos/ declares ONLY what it deviates from its archetype on, so a
# `git diff` over that directory shows exactly the drift and nothing else. See
# docs/plans/github-org-pulumi-import.md §3.2.
#
# IMPORTANT: these are the TARGET values, not current reality. During phases 1-3 the
# per-repo files record what each repo actually is today, deviations and all -- including
# where today's value is wrong. Making a wrong value explicit is what turns it into an
# auditable finding in phase 4 rather than an invisible one (§6). Nothing here is applied
# to GitHub until phase 5.
#
# No branch-protection block appears in any archetype. Since the C6c probe, protection is
# enforced by org rulesets targeting the `tier` custom property (§5.4), not by per-repo
# resources. Only `required_status_checks` stays per-repo, because check names differ.

archetypes:
  # Every non-archived repo inherits this.
  base:
    tier: standard
    delete_branch_on_merge: true
    allow_auto_merge: true
    # MERGE STRATEGY IS DELIBERATELY NOT ENFORCED (decision 2026-08-05).
    #
    # Squash-merge is the general preference, but 158 of 178 active repos currently allow
    # all three strategies, so pinning squash-only in the archetype would turn CON-01 into
    # a fleet-wide behaviour change affecting ~89% of active repos rather than a cleanup of
    # outliers. Each repo therefore records its own `allow_*_merge` values verbatim (see
    # data/repos/), nothing is being asked to change, and CON-01 stays informational.
    #
    # To start enforcing: add `allow_squash_merge: true`, `allow_merge_commit: false`,
    # `allow_rebase_merge: false` here, and the per-repo files immediately show the 158
    # repos that would change. That diff IS the rollout plan -- review it before applying.
    has_issues: true
    has_wiki: false
    web_commit_signoff_required: true
    vulnerability_alerts: true
    # GITHUB'S NATIVE AUTO-FIX PRS ARE DELIBERATELY NOT ENABLED (decision 2026-08-14,
    # closing SEC-05 as won't-fix). The org's shared Renovate config
    # (`mitodl/.github:renovate-config`) already sets `vulnerabilityAlerts.enabled: true`
    # plus `osvVulnerabilityAlerts: true` -- Renovate opens its own fix PRs sourced from
    # the same `vulnerability_alerts` data (the toggle above) plus OSV as a second source,
    # bypassing its normal schedule. Turning this on too would duplicate that PR on every
    # repo extending the shared config. `access-forge` and `ckeditor-custom-build` are
    # explicit true overrides below/in their repo files -- they were already live-enabled
    # before this decision and are left as-is rather than turned off.
    dependabot_security_updates: false
    secret_scanning: enabled  # pragma: allowlist secret
    secret_scanning_push_protection: enabled  # pragma: allowlist secret
    default_branch: main
    # Repo access comes from these grants and nothing else -- no individual holds a
    # direct permission on a repo (§4.7). That makes the LEVEL here the whole access
    # story rather than a detail.
    #
    # `odl-engineering` is capped at push (maintain is also acceptable; admin is not --
    # policy 2026-08-05, audited as SEC-15). It is the broad engineering team, and admin
    # carries repo deletion, settings changes and ruleset bypass.
    #
    # NOT ASPIRATIONAL ANY MORE. The SEC-15 wave rewrote the 62 active repos that granted
    # `odl-engineering: admin` down to `push`. What remains above this line is the 55
    # ARCHIVED repos that still grant admin, which no resource in this project can reach
    # -- archived repos emit no TeamRepository (repository.py) because GitHub rejects the
    # write. They need a separate mechanism, tracked as its own task.
    #
    # POLICY 2026-08-10: both of these belong on every PUBLIC repo, not just on the ones
    # someone got around to. 149 repo files were filled in to match. The rule is scoped to
    # public deliberately -- the 10 active private repos keep their narrower grants, since
    # `access-forge` and `gwarek` being devops-only is the point rather than an oversight.
    teams:
      odl-engineering: push
      odl-engineering-owners: admin

  # Deployed services: mit-learn, mitxonline, ocw-studio, ...
  application:
    extends: base
    tier: tier-1
    visibility: public

  # Published packages and shared libraries: smoot-design, open-edx-plugins, ...
  library:
    extends: base
    tier: tier-1

  # A library whose release flow writes to its own default branch, and which is
  # therefore deliberately placed OUTSIDE org-ruleset governance. Today: `ol-django`.
  #
  # WHY. `scripts/release.py create --app <pkg> --push` bumps the version, folds
  # `changelog.d/` into CHANGELOG.md, commits, tags `<dist>/v<version>`, and pushes the
  # commit AND the tag. Under `tier-1` the commit half is rejected by
  # `baseline-default-branch`'s `pull_request` rule -- but a tag is a separate ref that
  # no ruleset here targets, so the tag lands anyway and `ci.yml`'s tag-gated `release`
  # job publishes to PyPI. The result is a shipped package whose release commit is on no
  # branch at all: the version bump never reaches `main` and the consumed changelog.d/
  # entries are never removed, so the NEXT release recomputes from a stale base.
  #
  # That is not hypothetical. `mitol-django-payment-gateway/v2026.8.26` is live on PyPI
  # while `main` still reads 2026.8.10 and still carries the three changelog.d/ entries
  # that release consumed; 8 of the 30 most recent release tags are orphaned this way.
  #
  # WHAT IT COSTS, stated plainly because nothing else will state it. No org ruleset
  # targets `unmanaged`, and bypass is per-RULESET rather than per-rule, so this does not
  # merely relax the review requirement -- it also drops `non_fast_forward` and
  # `deletion` on the default branch of a public, published library. AND SEC-01 EXEMPTS
  # `unmanaged`, so the audit will not report any of it. This comment is the only record
  # that the exposure was chosen rather than overlooked.
  #
  # WHY AN ARCHETYPE AND NOT `tier: unmanaged` ON THE REPO'S OWN YAML. Because that does
  # not survive. `_deviations()` in `bin/github-org-inventory` skips `tier` outright, so
  # the crawl never writes a top-level tier into a repo file -- the next
  # `crawl --refresh` would regenerate `repos/ol-django.yaml` without it, silently
  # returning the repo to `library`/`tier-1` and re-breaking the release flow with no
  # error anywhere. Archetype assignment lives in `archetypes-proposed.yaml`, which is
  # hand-maintained and preserved across crawls, so it is the only durable place to say
  # this. Same reason the YAML comment you are reading lives here and not there:
  # `crawl` regenerates the per-repo files with `yaml.safe_dump`, which drops comments.
  #
  # TO RETIRE THIS: fix the push ordering in ol-django's `release.py` so the tag is
  # pushed only after the branch lands, then move the repo back to `library`.
  library-unmanaged:
    extends: library
    tier: unmanaged

  # ol-infrastructure, ol-concourse, dagster.
  infrastructure:
    extends: base
    tier: tier-1
    # `devops: admin` rather than base's `push`, and rather than the `devops: push` this
    # archetype used to declare (decision 2026-08-07). `devops` is one of the two teams
    # policy sanctions for admin -- it operates the infrastructure it administers, so
    # settings changes and ruleset bypass are the job rather than an over-grant.
    #
    # The old `push` target was the reason CON-04 fired on every devops-admin repo: the
    # archetype disagreed with both the policy and reality, so the rule was reporting a
    # divergence nobody intended to close.
    #
    # `odl-engineering` IS listed here, unlike in an earlier draft of this file which
    # left it out to avoid widening access. Policy 2026-08-10 makes the widening the
    # point: odl-engineering and odl-engineering-owners belong on every public repo.
    # It has to be restated rather than inherited -- `teams` REPLACES the parent's
    # grants wholesale rather than merging into them, so omitting it here would revoke
    # it on any repo that takes this block.
    teams:
      devops: admin
      odl-engineering: push
      odl-engineering-owners: admin

  # Upstream forks: edx-platform, XBlock, tutor, frontend-app-*, ...
  #
  # `tier: unmanaged` is deliberate and load-bearing: no org ruleset targets that value,
  # so forks are explicitly untargeted rather than accidentally unprotected. That
  # distinction is what stops CON-09 from reporting ~115 repos it cannot act on (§9.2).
  fork:
    extends: base
    tier: unmanaged
    has_issues: false
    # EXEMPT FROM DEFAULT-BRANCH ASSIGNMENT (decision 2026-08-05). `null` means
    # explicitly not enforced, so this is dropped rather than inheriting `main` from
    # base. 102 active repos still default to `master` and nearly all are forks, where
    # the branch name is upstream's choice. CON-03 skips this archetype for the same
    # reason: a rule that fires 102 times with no action anyone would take is noise.
    default_branch:

  # The archived repos. Deliberately almost empty: GitHub rejects most writes to an
  # archived repo, so anything more here produces failed applies rather than policy.
  # They are imported rather than ignored so that nothing stops someone re-adding one
  # later with a full config -- see §4.4.
  #
  # Note this archetype does NOT extend base -- inheriting base's settings would emit a
  # config full of values that cannot be applied.
  #
  # `tier: unmanaged` is the same "deliberately untargeted" statement the forks make. An
  # `archived-freeze` ruleset targeting a distinct `tier: archived` was specified in §5.4
  # and dropped on 2026-08-05: GitHub already rejects writes to an archived repo, so it
  # would have enforced read-only on things that are read-only. Without a tier value at
  # all, CON-09 would fire on every archived repo for a label nobody intends to apply.
  archived:
    archived: true
    tier: unmanaged
