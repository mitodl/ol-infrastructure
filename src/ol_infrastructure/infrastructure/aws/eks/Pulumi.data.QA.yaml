  eks:nodegroups:
    # This nodegroup is only provisioned when eks:stateful_workload_storage_backend
    # is set to "io-optimized". With the current "ebs" backend it is defined here
    # for reference but will NOT be created by the infra program.
    io-optimized:
      disk_size_gb: 200
      instance_type: i4i.xlarge
      labels:
        node_size: i4i.xlarge
        ondemand: true
        ol.mit.edu/io_optimized: "true"
      node_group_options: {}
      scaling:
        desired: 1
        max: 3
        min: 1
      tags: {}
      taints:
        io-workload:
          value: "true"
          effect: NO_SCHEDULE
      version:
    worker-xlarge:
      disk_size_gb: 500
      # Memory is what this nodegroup runs out of, not CPU. Measured 2026-10-05
      # over 14 days across data-qa: actual CPU peaked at 5.0 cores (p99 3.3)
      # while memory requests averaged 143GiB and peaked at 164GiB, half of it
      # the three StarRocks FEs at 24GiB each. So the nodes are 8 vCPU/64GiB
      # (r8i-flex.2xlarge), the same memory per node as the m8i-flex.4xlarge
      # they replace at half the CPU. FE is pinned here with hard pod
      # anti-affinity (1 FE per node) and requests 1000m CPU; its 8000m limit
      # still fits one node.
      instance_type: r8i-flex.2xlarge
      labels:
        node_size: r8i-flex.2xlarge
        ondemand: true
        ol.mit.edu/core_node: true
      node_group_options: {}
      # 4, not 3, as in Production: the ASG spans 4 AZs, so at desired=3 one AZ
      # has no core node, and an FE whose EBS volumes live there cannot
      # schedule (fe-0, us-east-1b, 2026-10-05). Four of the smaller nodes
      # cost less than three of the larger ones did.
      scaling:
        desired: 4
        max: 5
        min: 4
      tags: {}
      taints: {}
      version:
  environment:business_unit: data
  environment:target_vpc: data_vpc
