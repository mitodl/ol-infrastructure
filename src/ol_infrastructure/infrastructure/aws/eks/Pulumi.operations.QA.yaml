config:
  environment:business_unit: operations
  environment:target_vpc: operations_vpc
  eks:allowed_dns_zones:
  - .odl.mit.edu
  - odl.mit.edu
  - .ol.mit.edu
  - ol.mit.edu
  eks:apisix_domains:
  - celery-monitoring-qa.odl.mit.edu
  - toolhive-swe.qa.ol.mit.edu
  - witan.qa.ol.mit.edu
  eks:backup: false
  eks:developer_role_policy_name: AmazonEKSAdminPolicy
  eks:developer_role_kubernetes_groups:
  - admin
  eks:ebs_csi_provisioner: true
  eks:efs_csi_provisioner: true
  eks:gateway_release_channel: experimental
  eks:namespaces:
  - keycloak
  - kubewatch
  - toolhive-operator
  - toolhive-swe
  - toolhive-apps
  - toolhive-data
  - omnigraph
  - vuln-scanner
  - witan
  - observability-archive
  eks:nodegroups:
    worker-xlarge:
      instance_type: c8i-flex.xlarge
      labels:
        ondemand: true
        node_size: c8i-flex.xlarge
        ol.mit.edu/core_node: true
      disk_size_gb: 500
      scaling:
        desired: 3
        min: 3
        max: 6
      version:
      tags: {}
      taints: {}
      node_group_options: {}
    archive-xlarge:
      # Telemetry archive (ADR-0014). Single AZ on purpose: Loki and Mimir run at
      # replication factor 1, so a multi-AZ ring would only add transfer cost.
      instance_type: m8i-flex.xlarge
      availability_zone: us-east-1a
      labels:
        ondemand: true
        node_size: m8i-flex.xlarge
        ol.mit.edu/archive_node: "true"
      disk_size_gb: 250
      # Loki, the archive ingress and the node daemons already request ~5.4 of
      # the 7.8 vCPU two nodes offer; Mimir adds ~3 more even at QA's trimmed
      # requests, and nothing autoscales this group.
      scaling:
        desired: 3
        min: 3
        max: 3
      version:
      tags: {}
      taints:
        ol.mit.edu/archive_workload:
          value: "true"
          effect: NoSchedule
      node_group_options: {}
  eks:apisix_admin_key:
