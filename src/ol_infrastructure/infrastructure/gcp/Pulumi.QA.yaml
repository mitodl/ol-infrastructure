---
config:
  ol_gcp:projects:
  - project_id: mitol01
    business_unit: operations
    region: us-east1
    # No enabled_services here. mitol01 is one GCP project serving all three
    # tiers, and an enabled API is a property of the project rather than of a
    # tier -- declaring it in more than one stack would mean two Pulumi
    # resources fighting over one API. The Production stack owns them.
    api_keys:
    - key_name: learn-ai-qa
      display_name: Learn AI QA
      restrictions:
        api_targets:
        - service: generativelanguage.googleapis.com
      import_id: projects/32631020496/locations/global/keys/8430d143-3274-48a3-b92d-f5c3ef2b76aa
