---
config:
  ol_gcp:projects:
  - project_id: mitol01
    # Required because this project declares api_keys: the API Keys API
    # identifies projects by NUMBER, so a key read back from GCP carries the
    # number. Declaring the id instead makes every plan want to replace the
    # key -- a new key string and a broken consumer.
    project_number: '32631020496'
    business_unit: operations
    region: us-east1
      # Only the services with a proven consumer. mitol01 also has dataform,
      # orgpolicy and storage-component enabled; those are left unmanaged
      # deliberately rather than adopted for completeness, and
      # disable_on_destroy=False means leaving them out turns nothing off.
    enabled_services:
    - aiplatform.googleapis.com
    - generativelanguage.googleapis.com
    - googleads.googleapis.com
      # These two are what the PROVIDER needs in order to read the resource
      # types this stack manages, not what an application consumes. They must
      # already be enabled before the first refresh can succeed -- a stack
      # cannot enable the API it needs in order to look at itself. Enabled out
      # of band during bootstrap, then declared here so they stay that way.
    - iam.googleapis.com
    - apikeys.googleapis.com
    service_accounts:
      # The stack's own automation identity, adopted so the federation wiring
      # is reviewable here instead of living as console clicks nobody can
      # reproduce. protect=True comes with the import: replacing this account
      # would break every subsequent run.
    - account_id: pulumi-gcp
      display_name: Pulumi GCP provider
      import_id: projects/mitol01/serviceAccounts/pulumi-gcp@mitol01.iam.gserviceaccount.com
      iam_members:
        # Which workload may exchange its identity for this account's token.
        # The provider's attribute condition already restricts this to the
        # production Concourse infra pool; this binding names the pool again.
        # The import_id below is ONE space-delimited string of three segments
        # (account / role / member) that YAML folds back together across the
        # line break. Do not let an extra space into it.
      - role: roles/iam.workloadIdentityUser
        member: principalSet://iam.googleapis.com/projects/32631020496/locations/global/workloadIdentityPools/ol-infrastructure/attribute.concourse_env/production
        import_id: projects/mitol01/serviceAccounts/pulumi-gcp@mitol01.iam.gserviceaccount.com
          roles/iam.workloadIdentityUser principalSet://iam.googleapis.com/projects/32631020496/locations/global/workloadIdentityPools/ol-infrastructure/attribute.concourse_env/production
        # Who may impersonate this account to run a local preview. A GROUP,
        # not individuals -- onboarding an engineer is a membership change
        # rather than a Pulumi change. Note roles/owner does NOT confer this;
        # verified 2026-08-19, a project Owner still 403s without it.
      - role: roles/iam.serviceAccountTokenCreator
        member: group:odl-devops@mit.edu
      # The tier a credential serves is carried in its own name and restrictions,
      # not in the stack it is declared from. See README.md -- splitting these
      # across CI/QA/Production stacks would buy naming, not isolation, because
      # every role the automation account needs is project-scoped.
    api_keys:
    - key_name: learn-ai-production
      display_name: Learn AI Production
      restrictions:
        api_targets:
        - service: generativelanguage.googleapis.com
      import_id: projects/32631020496/locations/global/keys/ac4d9961-5294-4b21-85c9-e61e6e5d8a9d
    - key_name: learn-ai-qa
      display_name: Learn AI QA
      restrictions:
        api_targets:
        - service: generativelanguage.googleapis.com
      import_id: projects/32631020496/locations/global/keys/8430d143-3274-48a3-b92d-f5c3ef2b76aa
    - key_name: learn-ai-ci
      display_name: Learn AI CI
      restrictions:
        api_targets:
        - service: generativelanguage.googleapis.com
      import_id: projects/32631020496/locations/global/keys/c221d64a-8015-43db-8e54-10c9d87f1dcd
        # No identified consumer. Created 2025-12-30, restricted to both AI APIs.
    - key_name: translations-experimentation
      display_name: Translations Experimentation
      restrictions:
        api_targets:
        - service: generativelanguage.googleapis.com
        - service: aiplatform.googleapis.com
      import_id: projects/32631020496/locations/global/keys/44e4eae4-247b-4c04-ae86-82b7bae0f933
secretsprovider: awskms://alias/infrastructure-secrets-production
