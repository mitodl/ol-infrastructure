---
secretsprovider: awskms://alias/infrastructure-secrets-production
config:
  azure_openai:location: eastus
  # dagster-ml embeds Learn's content with the model Learn's vectors come from. Setting
  # this key replaces the code default, so mitlearn's list is repeated.
  azure_openai:consumer_extra_models:
    mitlearn:
    - text-embedding-3-large
    - text-embedding-3-small
    dagster-ml:
    - text-embedding-3-large
  # 1M TPM per deployment. Four consumers x 1000 is 4000 units of each model's
  # subscription-wide pool; the tightest is gpt-5-mini at 10000 (measured 2026-09-29).
  azure_openai:model_capacity: 1000
  # The versions CI and QA have been serving (auto-upgraded there, so they canary new
  # defaults). Pinning makes these NoAutoUpgrade in Production only.
  azure_openai:model_versions:
    gpt-4o: "2024-11-20"
    gpt-5-mini: "2025-08-07"
    gpt-5.2: "2025-12-11"
    # "1" is the only version either model has (list-models, 2026-09-30). -small
    # deploys on mitlearn's account only, using 1000 of its own 10000-unit pool; -large
    # also deploys on dagster-ml's, using 2000 of its pool here plus QA's 305 and CI's 5.
    text-embedding-3-large: "1"
    text-embedding-3-small: "1"
