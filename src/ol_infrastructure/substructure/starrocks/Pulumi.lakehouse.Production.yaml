config:
  vault:address: https://vault-production.odl.mit.edu
  vault_server:env_namespace: operations.production
  starrocks:applications_stack_name: lakehouse.Production
  starrocks:db_admin_username: root
  starrocks:verify_connection: "false"
  starrocks:ssl_enabled: "true"
  starrocks:enable_data_lake_integration: "true"
  starrocks:aws_region: us-east-1
  starrocks:domain: lakehouse.starrocks.ol.mit.edu
  starrocks:oidc_enabled: "true"
  # The FE runs query queue v1 (enable_query_queue_v2 = false in the
  # applications stack's fe.conf), which queues each resource group against its
  # own concurrency_limit. SELECTs, loads (INSERT) and statistics jobs all go
  # through the queue, so batch's INSERTs wait for a slot rather than being
  # rejected by the CN.
  # There is no global cap: interactive, with no concurrency_limit, never waits
  # behind batch, and its exclusive cores isolate its CPU. See
  # resource_groups.py.
  starrocks:query_queue:
    enable_query_queue_select: true
    enable_query_queue_load: true
    enable_query_queue_statistic: true
    enable_group_level_query_queue: true
    query_queue_concurrency_limit: 0
    query_queue_pending_timeout_second: 300
  # CN pods here request 4 CPU with a 16 CPU limit. StarRocks caps
  # exclusive_cpu_cores at the smallest CN's reported cores minus one, and a
  # CN reports its limit (16 cores), not its request.
  # The value below is the request minus one, so the dedicated threads have
  # CPU the pod is guaranteed and one requested core stays shared.
  # Keep CN pods uniformly sized (applications/starrocks starrocks:cn_config)
  # and revisit this when they change. mem_limit is a fraction of each CN's
  # query pool (90% of the CN's mem_limit, itself 90% of the pod memory
  # limit); big_query_mem_limit is bytes per CN (6Gi).
  starrocks:resource_groups:
    interactive:
      exclusive_cpu_cores: 3
      mem_limit: 0.4
      concurrency_limit: 0
    batch:
      cpu_weight_percent: 100
      mem_limit: 0.6
      big_query_mem_limit: 6442450944
      # Queries past this wait in the FE queue. Sized for one dbt build (4
      # threads, ol_dbt profiles.yml) plus as many again for OpenMetadata, the
      # mit-learn pull and Iceberg maintenance.
      concurrency_limit: 8
