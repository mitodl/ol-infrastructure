---
name: ol-substructure-keycloak
runtime: python
description: A project for managing Keycloak configuration
# keycloak.Realm sends browserFlow/firstBrokerLoginFlow from its own state on every
# update. That state keeps the built-in aliases from creation until a refresh, so a
# non-refreshing update rebinds the built-in flows over the ones
# keycloak.authentication.Bindings set, and preview shows no diff.
options:
  refresh: always
backend:
  url: s3://mitol-pulumi-state/
