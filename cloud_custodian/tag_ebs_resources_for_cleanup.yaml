---
policies:
  # The first set of policies finds ODL autoscale resources and identifies AMIs that were, at one point, ever used with them.
  # It will then clean up the AMIs + snapshots
- name: find-mitodl-asg
  resource: aws.asg
  description: |
    Find all MIT ODL autoscale groups and take no action. Linked launch templates are used in the next policy.
  filters:
  - and:
    - "tag:pulumi_managed": present
    - type: value
      key: 'tag:OU'
      op: ne
      value: 'ike'
- name: find-mitodl-ltv
  resource: aws.launch-template-version
  description: |
    Find all inactive MIT ODL launch template version and take no action. Will used the linked AMI in the next policy.
  filters:
  - and:
    - type: value
      key: LaunchTemplateId
      op: in
      value_from:
        url: file:find-mitodl-asg/resources.json
        format: json
        expr: "[].Instances[].LaunchTemplate.LaunchTemplateId"
    - DefaultVersion: false
    - type: value
      key: 'tag:OU'
      op: ne
      value: 'ike'
- name: find-and-mark-mitodl-ami
  resource: aws.ami
  description: |
    Find all MIT ODL AMI IDs that go with the inactive launch template versions and tag them for cleanup.
  filters:
  - and:
    - type: value
      key: ImageId
      op: in
      value_from:
        url: file:find-mitodl-ltv/resources.json
        format: json
        expr: "[].LaunchTemplateData.ImageId"
    - type: image-age
      op: gt
      days: 30
    - type: unused
      value: true
    - type: value
      key: 'tag:custodian_cleanup'
      value: absent
    - type: value
      key: 'tag:OU'
      op: ne
      value: 'ike'
  actions:
  - type: mark-for-op
    tag: custodian_cleanup
    op: deregister
    days: 30
- name: find-and-mark-associated-mitodl-snapshots
  resource: aws.ebs-snapshot
  description: |
    Find the snapshots associated with the unused AMIs from the previous policy. Tag them for deletion. Found snapshots will be used in the next policy to tmark the volumes for cleanup as well.
  filters:
  - and:
    - type: value
      key: SnapshotId
      op: in
      value_from:
        url: file:find-and-mark-mitodl-ami/resources.json
        format: json
        expr: "[].BlockDeviceMappings[].Ebs.SnapshotId"
    - type: age
      op: gt
      days: 30
    - type: value
      key: Description
      op: regex
      value: '^.*CreateImage.*$'
    - type: value
      key: 'tag:custodian_cleanup'
      value: absent
    - type: value
      key: 'tag:OU'
      op: ne
      value: 'ike'
  actions:
  - type: mark-for-op
    tag: custodian_cleanup
    op: delete
    days: 30

# This second chain of policies find the AMIs created by packer that were never associated with an autoscaling resource.
# It will mark them for cleanup and then loop through their associated snapshots and mark those as well.
- name: find-and-mark-unassociated-mitodl-ami
  resource: aws.ami
  description: |
    Find all inactive MITODL AMIs created by packer and mark them for cleanup. These AMIs were never associated with a launch template.
  filters:
  - and:
    - type: value
      key: Description
      op: regex
      value: '^Deployment image for .* generated at \d{14}$'
    - type: image-age
      op: gt
      days: 30
    - type: unused
      value: true
    - type: value
      key: 'tag:custodian_cleanup'
      value: absent
    - type: value
      key: 'tag:OU'
      op: ne
      value: 'ike'
  actions:
  - type: mark-for-op
    tag: custodian_cleanup
    op: deregister
    days: 30
- name: find-and-mark-unassociated-mitodl-snapshots
  resource: aws.ebs-snapshot
  description: |
    Find the snapshots associated with the unused AMIs from the previous policy. Tag them for deletion.
  filters:
  - and:
    - type: value
      key: SnapshotId
      op: in
      value_from:
        url: file:find-and-mark-unassociated-mitodl-ami/resources.json
        format: json
        expr: "[].BlockDeviceMappings[].Ebs.SnapshotId"
    - type: age
      op: gt
      days: 30
    - type: value
      key: Description
      op: regex
      value: '^.*CreateImage.*$'
    - type: value
      key: 'tag:custodian_cleanup'
      value: absent
    - type: value
      key: 'tag:OU'
      op: ne
      value: 'ike'
  actions:
  - type: mark-for-op
    tag: custodian_cleanup
    op: delete
    days: 30

# This third chain handles orphaned EBS *volumes* -- ones sitting in the
# `available` (unattached) state with no owner left to reclaim them. The two
# chains above only ever reach volumes indirectly, via the AMIs and snapshots
# they back, so a volume whose instance was terminated without
# DeleteOnTermination was never swept by anything.
- name: find-and-mark-orphaned-ebs-volumes
  resource: aws.ebs
  description: |
    Find unattached EBS volumes that no longer have an owner and mark them for
    deletion. Deleting a volume is irreversible, so every filter here is a
    deliberate carve-out rather than a broad sweep:

    - `available` only. An attached volume is in use by definition.
    - Older than 90 days. AWS exposes no "detached since" attribute, so volume
      age is the closest proxy. Combined with the 30 day `mark-for-op` delay
      below this puts at least 120 days between creation and deletion, which
      keeps freshly provisioned volumes well clear.
    - Not `OU: ike`, matching the carve-out the policies above already make --
      ike resources are managed outside this account's automation.
    - Not Kubernetes-managed. The EBS CSI driver detaches volumes routinely
      while a StatefulSet pod reschedules, so `available` does not imply
      orphaned for them -- a StarRocks FE or Open edX PVC can sit detached for
      weeks and still be live data. Their reclaim policy is the PV's job, not
      ours. Both the `KubernetesCluster` and `ebs.csi.aws.com/cluster` tags are
      checked because older in-tree-provisioned volumes only carry the former.
    - Not `pulumi_managed`. Those belong to a stack, and deleting one behind
      Pulumi's back produces drift rather than savings.
    - Not already marked, so a volume that stays orphaned does not have its
      deletion date pushed out on every run (see #1472).
  filters:
  - and:
    - type: value
      key: State
      value: available
    - type: value
      key: CreateTime
      value_type: age
      op: gt
      value: 90
    - type: value
      key: 'tag:OU'
      op: ne
      value: 'ike'
    - type: value
      key: 'tag:KubernetesCluster'
      value: absent
    - type: value
      key: 'tag:ebs.csi.aws.com/cluster'
      value: absent
    - type: value
      key: 'tag:pulumi_managed'
      value: absent
    - type: value
      key: 'tag:custodian_cleanup'
      value: absent
  actions:
  - type: mark-for-op
    tag: custodian_cleanup
    op: delete
    days: 30
- name: unmark-reattached-ebs-volumes
  resource: aws.ebs
  description: |
    Clear the cleanup mark from any volume that has been attached again since
    it was marked. Without this a volume could be marked while idle, returned
    to service, and then deleted the moment it is next detached -- the mark
    would already have matured and the delete policy would fire immediately.
  filters:
  - and:
    - type: value
      key: 'tag:custodian_cleanup'
      value: present
    - type: value
      key: State
      op: ne
      value: available
  actions:
  - type: remove-tag
    tags:
    - custodian_cleanup
